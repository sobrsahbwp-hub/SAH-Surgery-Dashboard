<!3rd DASHBOARD html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sadiq Abbasi Hospital – Surgery Dashboard</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- PDF Export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:15px;
}
.header{
    text-align:center;
    margin-bottom:10px;
}
.header img{
    height:80px;
    display:block;
    margin:0 auto 6px;
}
.header h1{
    margin:0;
    color:#0b4f6c;
}
.header h3{
    margin:4px 0;
    color:#555;
    font-weight:normal;
}

.card{
    background:#fff;
    padding:12px;
    border-radius:8px;
    margin-bottom:12px;
    box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:8px;
}
label{
    font-size:12px;
    font-weight:bold;
}
select,input{
    width:100%;
    padding:5px;
    font-size:12px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
    text-align:center;
}
.kpi{
    background:#eaf4f4;
    padding:10px;
    border-radius:8px;
}
.kpi h2{
    margin:0;
    color:#0b4f6c;
}
.kpi p{
    margin:4px 0 0;
    font-size:12px;
}
  .charts{
    display: flex;
    flex-direction: column;   /* force vertical stacking */
    align-items: center;      /* center charts horizontally */
    gap: 20px;
}


}
canvas{
    width: 100% !important;
    max-width: 420px;   /* keeps charts aligned and same size */
    max-height: 300px;
}


footer{
    text-align:center;
    margin-top:10px;
    font-size:12px;
    color:#555;
}

.export-btn{
    position:fixed;
    bottom:20px;
    left:20px;
    background:#0b4f6c;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:6px;
    cursor:pointer;
}

/* PRINT / PDF */
@media print{
    .filters,.export-btn{display:none;}
    body{background:#fff;padding:0;}
    @page{size:A4;margin:12mm;}
}
</style>
</head>

<body>

<div id="dashboard">

<!-- HEADER -->
<div class="header">
    <!-- Replace logo URL with official SAH monogram if available -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Emblem_of_Pakistan.svg">
    <h1>SADIQ ABBASI HOSPITAL</h1>
    <h3>Bahawalpur – Surgery Dashboard</h3>
</div>

<!-- FILTERS -->
<div class="card filters">
    <div>
        <label>OT</label>
        <select id="ot">
            <option>ALL OTS</option>
            <option>MAIN OT</option>
            <option>GYNAE OT</option>
            <option>EMERGENCY OT</option>
        </select>
    </div>

    <div>
        <label>Ward</label>
        <select id="ward">
            <option>ALL WARDS</option>
            <option>GYNAE</option>
            <option>ORTHO</option>
            <option>SURGERY</option>
            <option>EYE</option>
        </select>
    </div>

    <div>
        <label>Gender</label>
        <select id="gender">
            <option>ALL GENDERS</option>
            <option>MALE</option>
            <option>FEMALE</option>
            <option>TRANSGENDER</option>
        </select>
    </div>

    <div>
        <label>Age Group</label>
        <select id="age">
            <option>ALL AGES</option>
            <option>Below 30 Days</option>
            <option>1 Month to 1 Year</option>
            <option>1 Year to 15 Years</option>
            <option>15 to 30 Years</option>
            <option>30 Years to 45 Years</option>
            <option>45 Years & above</option>
        </select>
    </div>

    <div>
        <label>Surgery Type</label>
        <select id="type">
            <option>ALL TYPES</option>
            <option>MAJOR</option>
            <option>MINOR</option>
        </select>
    </div>

    <div>
        <label>From Date</label>
        <input type="date" id="from">
    </div>

    <div>
        <label>To Date</label>
        <input type="date" id="to">
    </div>
</div>

<!-- KPIs -->
<div class="card kpis">
    <div class="kpi"><h2 id="total">0</h2><p>Total Surgeries</p></div>
    <div class="kpi"><h2 id="male">0</h2><p>Male Surgeries</p></div>
    <div class="kpi"><h2 id="female">0</h2><p>Female Surgeries</p></div>
    <div class="kpi"><h2 id="major">0</h2><p>Major Surgeries</p></div>
    <div class="kpi"><h2 id="minor">0</h2><p>Minor Surgeries</p></div>
</div>

<!-- CHARTS -->
<div class="card charts">
    <canvas id="otChart"></canvas>
    <canvas id="wardChart"></canvas>
</div>

</div>

<button class="export-btn" onclick="exportPDF()">Export to PDF</button>

<footer>
Developed By: Software Engineer
<a href="https://www.linkedin.com/in/smus79" target="_blank">
<strong>MUHAMMAD UMAIR SYED</strong>
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

<script>
const sheetURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let data=[], otChart, wardChart;

fetch(sheetURL)
.then(r=>r.text())
.then(csv=>{
    const rows = csv.split("\n").map(r=>r.split(","));
    const headers = rows.shift();
    data = rows.map(r =>
        Object.fromEntries(headers.map((h,i)=>[h.trim(), r[i]?.trim()]))
    );
    applyFilters();
});

document.querySelectorAll("select,input").forEach(e => e.onchange = applyFilters);

function ageMatch(age, group){
    age = parseFloat(age);
    if(group==="Below 30 Days") return age < 0.1;
    if(group==="1 Month to 1 Year") return age >=0.1 && age <1;
    if(group==="1 Year to 15 Years") return age >=1 && age <15;
    if(group==="15 to 30 Years") return age >=15 && age <30;
    if(group==="30 Years to 45 Years") return age >=30 && age <45;
    if(group==="45 Years & above") return age >=45;
    return true;
}

function applyFilters(){
    const filtered = data.filter(d=>{
        if(ot.value!=="ALL OTS" && d.OT!==ot.value) return false;
        if(ward.value!=="ALL WARDS" && d.WARD!==ward.value) return false;
        if(gender.value!=="ALL GENDERS" && d.GENDER!==gender.value) return false;
        if(type.value!=="ALL TYPES" && d.TYPE!==type.value) return false;
        if(age.value!=="ALL AGES" && !ageMatch(d.AGE, age.value)) return false;
        if(from.value && new Date(d.DATE) < new Date(from.value)) return false;
        if(to.value && new Date(d.DATE) > new Date(to.value)) return false;
        return true;
    });

    total.textContent = filtered.length;
    male.textContent = filtered.filter(x=>x.GENDER==="MALE").length;
    female.textContent = filtered.filter(x=>x.GENDER==="FEMALE").length;
    major.textContent = filtered.filter(x=>x.TYPE==="MAJOR").length;
    minor.textContent = filtered.filter(x=>x.TYPE==="MINOR").length;

    drawPie(filtered,"OT","OT Wise Surgeries","otChart",c=>otChart=c,otChart);
    drawPie(filtered,"WARD","Ward Wise Surgeries","wardChart",c=>wardChart=c,wardChart);
}

function drawPie(rows, field, title, canvasId, setter, chartRef){
    const counts={};
    rows.forEach(r=>counts[r[field]]=(counts[r[field]]||0)+1);

    if(chartRef) chartRef.destroy();

    const chart = new Chart(document.getElementById(canvasId),{
        type:"pie",
        data:{
            labels:Object.keys(counts).map(k=>`${k} (${counts[k]})`),
            datasets:[{ data:Object.values(counts) }]
        },
        options:{
            plugins:{
                title:{ display:true, text:title }
            }
        }
    });
    setter(chart);
}

function exportPDF(){
    html2canvas(document.getElementById("dashboard")).then(canvas=>{
        const pdf = new jspdf.jsPDF("p","mm","a4");
        const w = 210;
        const h = canvas.height * w / canvas.width;
        pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,10,w,h);
        pdf.save("SAH_Surgery_Dashboard.pdf");
    });
}
</script>

</body>
</html>
