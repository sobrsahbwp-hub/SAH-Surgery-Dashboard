<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL – Executive Surgical Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    margin:0;
    font-family:Segoe UI, Arial;
    background:#f1f5f9;
    color:#1e293b;
}

/* HEADER */
header{
    background:#e2e8f0;
    padding:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

header img{height:75px;}
header h1{margin:0;font-size:22px;color:#1e3a8a;text-align:center;}

#clock{
    position:absolute;
    right:20px;
    top:20px;
    font-weight:600;
    font-size:14px;
}

/* CONTAINER */
.container{padding:20px;}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:25px;
}

.filter-box label{
    font-size:12px;
    font-weight:600;
    color:#1e40af;
}

.filter-box select,
.filter-box input{
    width:100%;
    padding:8px;
    border-radius:6px;
    border:1px solid #cbd5e1;
}

/* KPI */
.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:15px;
    margin-bottom:30px;
}

.kpi{
    background:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.kpi h2{
    margin:0;
    font-size:26px;
    color:#2563eb;
}

/* CHARTS */
.charts{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    justify-content:center;
}

.chart-box{
    background:white;
    padding:20px;
    border-radius:12px;
    width:100%;
    max-width:500px;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

footer{
    margin-top:30px;
    background:#e2e8f0;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    padding:8px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

#pdfBtn{background:#16a34a;color:white;}
#reloadBtn{background:#2563eb;color:white;}

@media(max-width:768px){
    header{flex-direction:column;}
    #clock{position:static;margin-top:8px;}
    footer{flex-direction:column;gap:8px;text-align:center;}
}
</style>
</head>

<body>

<header>
<div style="text-align:center;">
<img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU">
<h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h1>
</div>
<div id="clock"></div>
</header>

<div class="container" id="dashboard">

<div class="filters">
<div class="filter-box">
<label>OT</label>
<select id="otFilter"><option value="">ALL</option></select>
</div>

<div class="filter-box">
<label>Ward</label>
<select id="wardFilter"><option value="">ALL</option></select>
</div>

<div class="filter-box">
<label>Gender</label>
<select id="genderFilter">
<option value="">ALL</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option value="">ALL</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<div class="kpis">
<div class="kpi"><h2 id="total">0</h2><p>Total</p></div>
<div class="kpi"><h2 id="male">0</h2><p>Male</p></div>
<div class="kpi"><h2 id="female">0</h2><p>Female</p></div>
<div class="kpi"><h2 id="major">0</h2><p>Major</p></div>
<div class="kpi"><h2 id="minor">0</h2><p>Minor</p></div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
<div class="chart-box"><canvas id="pieChart"></canvas></div>
</div>

</div>

<footer>
<button id="pdfBtn" onclick="exportExecutivePDF()">Executive Summary PDF</button>
<div>IT Department – Sadiq Abbasi Hospital</div>
<button id="reloadBtn" onclick="location.reload()">Reload</button>
</footer>

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let otChart,wardChart,pieChart;
let lastFiltered=[];

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText=
new Date().toLocaleDateString()+" | "+new Date().toLocaleTimeString();
},1000);

/* FETCH */
Papa.parse(csvUrl,{
download:true,
header:true,
skipEmptyLines:true,
complete:res=>{
rawData=res.data.map(r=>{
let clean={};
Object.keys(r).forEach(k=>{
clean[k.trim().toUpperCase()]=r[k];
});
return clean;
});
populateFilters();
updateDashboard();
}
});

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",updateDashboard);
});

function populateFilters(){
[...new Set(rawData.map(r=>r.OT))].forEach(v=>{
if(v) otFilter.innerHTML+=`<option>${v}</option>`;
});
[...new Set(rawData.map(r=>r.WARD))].forEach(v=>{
if(v) wardFilter.innerHTML+=`<option>${v}</option>`;
});
}

function updateDashboard(){
const from=fromDate.value;
const to=toDate.value;

const filtered=rawData.filter(r=>{
if(otFilter.value && r.OT!==otFilter.value) return false;
if(wardFilter.value && r.WARD!==wardFilter.value) return false;
if(genderFilter.value && r.GENDER!==genderFilter.value) return false;
if(typeFilter.value && r.TYPE!==typeFilter.value) return false;
if(from && new Date(r.DATE)<new Date(from)) return false;
if(to && new Date(r.DATE)>new Date(to)) return false;
return true;
});

lastFiltered=filtered;

total.innerText=filtered.length;
male.innerText=filtered.filter(r=>r.GENDER==="MALE").length;
female.innerText=filtered.filter(r=>r.GENDER==="FEMALE").length;
major.innerText=filtered.filter(r=>r.TYPE==="MAJOR").length;
minor.innerText=filtered.filter(r=>r.TYPE==="MINOR").length;

drawChart("otChart",group(filtered,"OT"),"bar",otChart,c=>otChart=c);
drawChart("wardChart",group(filtered,"WARD"),"bar",wardChart,c=>wardChart=c);
drawChart("pieChart",{MAJOR:major.innerText,MINOR:minor.innerText},"pie",pieChart,c=>pieChart=c);
}

function group(data,key){
const obj={};
data.forEach(r=>{
if(r[key]) obj[r[key]]=(obj[r[key]]||0)+1;
});
return obj;
}

function drawChart(id,data,type,chart,setChart){
if(chart) chart.destroy();
setChart(new Chart(document.getElementById(id),{
type:type,
data:{
labels:Object.keys(data),
datasets:[{
data:Object.values(data),
backgroundColor:["#2563eb","#16a34a","#facc15","#f43f5e","#8b5cf6"]
}]
},
options:{responsive:true}
}));
}

/* EXECUTIVE PDF */
function exportExecutivePDF(){
let summary=`
<h2 style="text-align:center;">Executive Summary</h2>
<p><strong>Generated:</strong> ${new Date().toLocaleString()}</p>
<p><strong>Total Surgeries:</strong> ${total.innerText}</p>
<p><strong>Male:</strong> ${male.innerText}</p>
<p><strong>Female:</strong> ${female.innerText}</p>
<p><strong>Major:</strong> ${major.innerText}</p>
<p><strong>Minor:</strong> ${minor.innerText}</p>
<hr>
<h3>OT Wise Summary</h3>
${generateList(group(lastFiltered,"OT"))}
<h3>Ward Wise Summary</h3>
${generateList(group(lastFiltered,"WARD"))}
`;

const element=document.createElement("div");
element.innerHTML=summary + document.getElementById("dashboard").innerHTML;

html2pdf().from(element).save("Executive_Summary.pdf");
}

function generateList(obj){
let html="<ul>";
Object.keys(obj).forEach(k=>{
html+=`<li>${k} : ${obj[k]}</li>`;
});
html+="</ul>";
return html;
}
</script>

</body>
</html>
