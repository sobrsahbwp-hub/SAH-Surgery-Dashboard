<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadiq Abbasi Hospital - Surgery Dashboard</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* --- Add your CSS here (same as original) --- */
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-content">
      <div style="flex: 0 0 200px;"></div>
      <h1>Sadiq Abbasi Hospital, Bahawalpur<br><span style="font-size: 0.6em; font-weight: 400;">Surgery Data Dashboard</span></h1>
      <div class="clock" id="clock">
        <div class="time" id="time"></div>
        <div class="date" id="date"></div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-section">
    <div class="filters-grid">
      <!-- OT Filter -->
      <div class="filter-group">
        <label>Operating Theatre</label>
        <select id="otFilter"><option value="ALL">ALL OTS</option></select>
      </div>

      <!-- Ward Filter -->
      <div class="filter-group">
        <label>Ward</label>
        <select id="wardFilter"><option value="ALL">ALL WARDS</option></select>
      </div>

      <div class="filter-group">
        <label>Gender</label>
        <select id="genderFilter">
          <option>ALL</option><option>MALE</option><option>FEMALE</option><option>TRANSGENDER</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Age Group</label>
        <select id="ageFilter">
          <option value="ALL">ALL AGE GROUPS</option>
          <option>Below 30 Days</option>
          <option>1 Month to 1 Year</option>
          <option>1 Year to 15 Years</option>
          <option>15 to 30 Years</option>
          <option>30 Years to 45 Years</option>
          <option>45 Years to 60 Years</option>
          <option>65 Years & above</option>
        </select>
      </div>

      <div class="filter-group">
        <label>Surgery Type</label>
        <select id="typeFilter">
          <option value="ALL">ALL TYPES</option><option>MAJOR</option><option>MINOR</option>
        </select>
      </div>

      <div class="filter-group">
        <label>From</label><input type="date" id="fromDate">
      </div>

      <div class="filter-group">
        <label>To</label><input type="date" id="toDate">
      </div>
    </div>
  </div>

  <div id="loading" class="loading">Loading data...</div>

  <!-- KPIs and Charts ... same layout HTML as original ... -->

</div>

<script>
/* ======= CLOCK ======= */
function updateClock() {
  const now = new Date();
  document.getElementById('time').textContent = now.toLocaleTimeString();
  document.getElementById('date').textContent = now.toLocaleDateString();
}
setInterval(updateClock, 1000);
updateClock();

/* ======= DATA LOAD ======= */
let rawData = [];
let filteredData = [];
let charts = {};

function getCSVUrl() {
  // ← Make sure your Google Sheet is "Published to web" as CSV
  return `https://docs.google.com/spreadsheets/d/e/YOUR_SHEET_ID_HERE/pub?output=csv`;
}

function loadData() {
  Papa.parse(getCSVUrl(), {
    download: true,
    header: true,
    dynamicTyping: true,
    skipEmptyLines: true,
    complete: function(results) {
      rawData = results.data;
      document.getElementById('loading').style.display = 'none';
      initFilters();
      applyFilters();
    },
    error: function(err) {
      document.getElementById('loading').textContent = 'Error loading data.';
      console.error(err);
    }
  });
}

/* ======= FILTER LOGIC ======= */
function initFilters() {
  fillFilter('OT', 'otFilter');
  fillFilter('WARD', 'wardFilter');
  const dates = rawData.map(r => new Date(r.Date)).filter(d => !isNaN(d));
  if (dates.length) {
    document.getElementById('fromDate').value = new Date(Math.min(...dates)).toISOString().split('T')[0];
    document.getElementById('toDate').value = new Date(Math.max(...dates)).toISOString().split('T')[0];
  }

  ['otFilter','wardFilter','genderFilter','ageFilter','typeFilter','fromDate','toDate']
    .forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
}

function fillFilter(field, elementId) {
  const container = document.getElementById(elementId);
  const unique = [...new Set(rawData.map(r => r[field]).filter(v => v))].sort();
  unique.forEach(v => container.insertAdjacentHTML('beforeend', `<option>${v}</option>`));
}

function applyFilters() {
  const ot   = document.getElementById('otFilter').value;
  const wd   = document.getElementById('wardFilter').value;
  const gndr = document.getElementById('genderFilter').value;
  const ageF = document.getElementById('ageFilter').value;
  const typ  = document.getElementById('typeFilter').value;
  const from = new Date(document.getElementById('fromDate').value);
  const to   = new Date(document.getElementById('toDate').value);

  filteredData = rawData.filter(r => {
    const dt = new Date(r.Date);
    if (isNaN(dt)) return false;
    if (dt < from || dt > to) return false;
    if (ot !== 'ALL' && r.OT !== ot) return false;
    if (wd !== 'ALL' && r.WARD !== wd) return false;
    if (gndr !== 'ALL' && r.GENDER !== gndr) return false;
    if (typ !== 'ALL' && r.TYPE !== typ) return false;

    if (ageF !== 'ALL') {
      const ageGroup = getAgeGroup(r.AGE);
      if (ageGroup !== ageF) return false;
    }

    return true;
  });

  updateDashboard();
}

function getAgeGroup(age) {
  if (age < 30/365) return 'Below 30 Days';
  if (age < 1)         return '1 Month to 1 Year';
  if (age < 15)        return '1 Year to 15 Years';
  if (age < 30)        return '15 to 30 Years';
  if (age < 45)        return '30 Years to 45 Years';
  if (age < 60)        return '45 Years to 60 Years';
  return '65 Years & above';
}

/* ======= KPIS & CHARTS ======= */
function updateDashboard() {
  updateKPIs();
  updateCharts();
}

function updateKPIs() {
  document.getElementById('kpiTotal').textContent  = filteredData.length;
  document.getElementById('kpiMale').textContent   =
    filteredData.filter(r => r.GENDER === 'MALE').length;
  document.getElementById('kpiFemale').textContent =
    filteredData.filter(r => r.GENDER === 'FEMALE').length;
  document.getElementById('kpiMajor').textContent =
    filteredData.filter(r => r.TYPE === 'MAJOR').length;
  document.getElementById('kpiMinor').textContent =
    filteredData.filter(r => r.TYPE === 'MINOR').length;

  document.getElementById('kpiLocal').textContent =
    filteredData.filter(r => /LOCAL/i.test(r.ANAESTHESIA)).length;
  document.getElementById('kpiSpinal').textContent =
    filteredData.filter(r => /SPINAL/i.test(r.ANAESTHESIA)).length;
  document.getElementById('kpiGeneral').textContent =
    filteredData.filter(r => /GENERAL|GA/i.test(r.ANAESTHESIA)).length;
}

function countBy(field) {
  return filteredData.reduce((obj, row) => {
    const key = row[field] || 'Unknown';
    obj[key] = (obj[key]||0) + 1;
    return obj;
  }, {});
}

function renderChart(id, data) {
  if (charts[id]) charts[id].destroy();
  const ctx = document.getElementById(id).getContext('2d');
  charts[id] = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(data),
      datasets: [{
        label: '#',
        data: Object.values(data),
        backgroundColor: '#0066cc'
      }]
    }
  });
}

function updateCharts() {
  renderChart('otChart', countBy('OT'));
  renderChart('wardChart', countBy('WARD'));
  renderChart('typeChart', countBy('TYPE'));

  const anaes = {};
  filteredData.forEach(r => {
    const a = (r.ANAESTHESIA||'Unknown').toUpperCase();
    const key = /LOCAL/.test(a)? 'LOCAL' : /SPINAL/.test(a)? 'SPINAL' : /GENERAL|GA/.test(a) ? 'GENERAL' : a;
    anaes[key] = (anaes[key]||0) + 1;
  });
  renderChart('anaesthesiaChart', anaes);
}

/* ======= START ======= */
window.onload = loadData;
</script>

</body>
</html>
