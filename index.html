<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
font-family:Segoe UI, sans-serif;
margin:0;
background:linear-gradient(135deg,#e3f2fd,#f1f8ff);
color:#003366;
}

.container{
max-width:1300px;
margin:auto;
padding:15px;
}

.header{
text-align:center;
font-size:22px;
font-weight:bold;
margin-top:10px;
}

.clock{
position:absolute;
left:20px;
top:10px;
font-weight:bold;
}

.filters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:15px;
margin-top:20px;
}

.filter-box{
display:flex;
flex-direction:column;
}

select,input{
padding:8px;
border-radius:8px;
border:1px solid #ccc;
}

.kpi{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
margin:8px;
}

.kpi h2{margin:0;}
.kpi-row{
display:flex;
flex-wrap:wrap;
justify-content:center;
}

.total{
font-size:26px;
font-weight:bold;
}

.chart-row{
display:flex;
flex-wrap:wrap;
justify-content:center;
margin-top:20px;
}

canvas{
max-width:400px;
margin:20px;
}

.footer{
margin-top:30px;
text-align:center;
font-size:14px;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:20px;
}

@media print{
body{background:white;}
canvas,.buttons{display:none;}
}
</style>
</head>

<body>
<div class="clock" id="clock"></div>

<div class="container">
<div class="header">
DATA of SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)
</div>

<div class="filters">
<div class="filter-box">
<label>OT</label>
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div class="filter-box">
<label>WARD</label>
<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div class="filter-box">
<label>Gender</label>
<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-box">
<label>Age Group</label>
<select id="ageFilter">
<option>ALL</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<!-- KPIs -->
<div class="kpi total" id="totalKPI">Total Surgeries: 0</div>

<div class="kpi-row">
<div class="kpi">Male<br><h2 id="maleKPI">0</h2></div>
<div class="kpi">Female<br><h2 id="femaleKPI">0</h2></div>
</div>

<div class="kpi-row">
<div class="kpi">Major<br><h2 id="majorKPI">0</h2></div>
<div class="kpi">Minor<br><h2 id="minorKPI">0</h2></div>
</div>

<div class="kpi-row">
<div class="kpi">Local<br><h2 id="localKPI">0</h2></div>
<div class="kpi">Spinal<br><h2 id="spinalKPI">0</h2></div>
<div class="kpi">General<br><h2 id="generalKPI">0</h2></div>
</div>

<div class="chart-row">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary (PDF)</button>
<button onclick="location.reload()">Refresh</button>
</div>

<div class="footer">
Developed By: 
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</a>
</div>
</div>

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";
let rawData=[];

Papa.parse(csvUrl,{
download:true,
header:true,
complete:function(results){
rawData=results.data;
updateDashboard();
}
});

function updateDashboard(){
let filtered=rawData.filter(row=>{
let ot=row[Object.keys(row)[1]];
let ward=row[Object.keys(row)[2]];
let date=row[Object.keys(row)[3]];
let gender=row[Object.keys(row)[6]];
let age=parseInt(row[Object.keys(row)[7]]);
let ana=row[Object.keys(row)[29]];
let type=row[Object.keys(row)[30]];

if(document.getElementById("otFilter").value!="ALL OTS" && ot!=document.getElementById("otFilter").value) return false;
if(document.getElementById("wardFilter").value!="ALL WARDS" && ward!=document.getElementById("wardFilter").value) return false;
if(document.getElementById("genderFilter").value!="ALL GENDERS" && gender!=document.getElementById("genderFilter").value) return false;
if(document.getElementById("typeFilter").value!="ALL TYPES" && type!=document.getElementById("typeFilter").value) return false;

let from=document.getElementById("fromDate").value;
let to=document.getElementById("toDate").value;
if(from && new Date(date)<new Date(from)) return false;
if(to && new Date(date)>new Date(to)) return false;

return true;
});

let total=filtered.length;
let male=filtered.filter(r=>r[Object.keys(r)[6]]=="MALE").length;
let female=filtered.filter(r=>r[Object.keys(r)[6]]=="FEMALE").length;
let major=filtered.filter(r=>r[Object.keys(r)[30]]=="MAJOR").length;
let minor=filtered.filter(r=>r[Object.keys(r)[30]]=="MINOR").length;
let local=filtered.filter(r=>r[Object.keys(r)[29]]=="LOCAL").length;
let spinal=filtered.filter(r=>r[Object.keys(r)[29]]=="SPINAL").length;
let general=filtered.filter(r=>r[Object.keys(r)[29]]=="GENERAL").length;

document.getElementById("totalKPI").innerHTML="TOTAL SURGERIES: "+total;
document.getElementById("maleKPI").innerHTML=male;
document.getElementById("femaleKPI").innerHTML=female;
document.getElementById("majorKPI").innerHTML=major;
document.getElementById("minorKPI").innerHTML=minor;
document.getElementById("localKPI").innerHTML=local;
document.getElementById("spinalKPI").innerHTML=spinal;
document.getElementById("generalKPI").innerHTML=general;

drawChart("otChart",groupCount(filtered,1),"OT Wise Data");
drawChart("wardChart",groupCount(filtered,2),"Ward Wise Data");
}

function groupCount(data,index){
let counts={};
data.forEach(r=>{
let key=r[Object.keys(r)[index]];
counts[key]=(counts[key]||0)+1;
});
return counts;
}

function drawChart(id,data,title){
let ctx=document.getElementById(id).getContext('2d');
new Chart(ctx,{
type:'pie',
data:{
labels:Object.keys(data),
datasets:[{
data:Object.values(data),
backgroundColor:["#42a5f5","#66bb6a","#ffa726","#ab47bc","#ef5350"]
}]
},
options:{
plugins:{
title:{display:true,text:title},
legend:{position:'bottom'}
}
}
});
}

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",updateDashboard);
});

function exportPDF(){
const { jsPDF }=window.jspdf;
let doc=new jsPDF();
doc.text("SADIQ ABBASI HOSPITAL - Executive Summary",20,20);
doc.text(document.getElementById("totalKPI").innerText,20,40);
doc.save("Executive_Summary.pdf");
}

function updateClock(){
let now=new Date();
document.getElementById("clock").innerHTML=
now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
</script>
</body>
</html>
