<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL - Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#f2f7fb;
    color:#1a1a1a;
}
header{
    background:#ffffff;
    padding:20px;
    text-align:center;
    font-size:22px;
    font-weight:700;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    position:relative;
}
#clock{
    position:absolute;
    right:20px;
    top:20px;
    font-size:14px;
    font-weight:600;
    color:#0066cc;
}
.section{
    background:#ffffff;
    margin:20px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.05);
}
.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
}
.filter-box{
    display:flex;
    flex-direction:column;
    min-width:160px;
}
label{
    font-size:13px;
    font-weight:600;
    margin-bottom:4px;
}
select,input{
    padding:6px;
    border-radius:6px;
    border:1px solid #ccc;
}
.kpis{
    text-align:center;
}
.kpi-big{
    font-size:40px;
    font-weight:800;
    color:#0066cc;
}
.kpi-row{
    display:flex;
    justify-content:center;
    gap:50px;
    margin-top:12px;
    flex-wrap:wrap;
}
.kpi{
    font-weight:600;
    font-size:15px;
}
.chart-row{
    display:flex;
    justify-content:center;
    gap:50px;
    flex-wrap:wrap;
    margin-top:20px;
}
.chart-box{
    width:320px;
    height:320px;
}
canvas{
    width:100% !important;
    height:100% !important;
}
.buttons{
    display:flex;
    justify-content:space-between;
    margin:20px;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:6px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}
button:hover{
    background:#004c99;
}
footer{
    text-align:center;
    padding:12px;
    font-size:13px;
    background:#ffffff;
    box-shadow:0 -2px 6px rgba(0,0,0,0.05);
}
@media(max-width:768px){
    .chart-row{flex-direction:column;align-items:center;}
}
@media print{
    body{width:210mm;height:297mm;}
}
</style>
</head>

<body>

<header>
DATA of SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)
<div id="clock"></div>
</header>

<div class="section">
<div class="filters">

<div class="filter-box">
<label>OT</label>
<select id="otFilter">
<option value="ALL">ALL OTS</option>
<option value="MAIN OT">MAIN OT</option>
<option value="GYNAE OT">GYNAE OT</option>
</select>
</div>

<div class="filter-box">
<label>WARD</label>
<select id="wardFilter">
<option value="ALL">ALL WARDS</option>
<option value="GYNAE">GYNAE</option>
<option value="ORTHO">ORTHO</option>
<option value="SURGERY">SURGERY</option>
<option value="EYE">EYE</option>
</select>
</div>

<div class="filter-box">
<label>Gender</label>
<select id="genderFilter">
<option value="ALL">ALL GENDERS</option>
<option value="MALE">MALE</option>
<option value="FEMALE">FEMALE</option>
<option value="TRANSGENDER">TRANSGENDER</option>
</select>
</div>

<div class="filter-box">
<label>Age Group</label>
<select id="ageFilter">
<option value="ALL">ALL</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option value="ALL">ALL TYPES</option>
<option value="MAJOR">MAJOR</option>
<option value="MINOR">MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>
</div>

<div class="section kpis" id="summarySection">

<div class="kpi-big" id="totalSurgeries">0</div>
<div><b>Total Surgeries</b></div>

<div class="kpi-row">
<div class="kpi" id="maleCount">Male: 0</div>
<div class="kpi" id="femaleCount">Female: 0</div>
</div>

<div class="kpi-row">
<div class="kpi" id="majorCount">Major: 0</div>
<div class="kpi" id="minorCount">Minor: 0</div>
</div>

<div class="kpi-row">
<div class="kpi" id="localCount">Local: 0</div>
<div class="kpi" id="spinalCount">Spinal: 0</div>
<div class="kpi" id="generalCount">General: 0</div>
</div>

<br>
<div id="execText" style="max-width:800px;margin:auto;font-size:14px;"></div>

</div>

<div class="section">
<div class="chart-row">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
</div>

<div class="chart-row">
<div class="chart-box"><canvas id="typeChart"></canvas></div>
<div class="chart-box"><canvas id="anaChart"></canvas></div>
</div>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary</button>
<button onclick="location.reload()">Refresh</button>
</div>

<footer>
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</a>
</footer>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let charts={};

function normalize(v){ return v? v.trim().toUpperCase():""; }

fetch(sheetURL)
.then(r=>r.text())
.then(csv=>{
    const rows=csv.split("\n").slice(1);
    rawData=rows.map(row=>{
        const c=row.split(",");
        return{
            ot:normalize(c[1]),
            ward:normalize(c[2]),
            date:new Date(c[3]),
            gender:normalize(c[6]),
            age:parseFloat(c[7]),
            anaesthesia:normalize(c[29]),
            type:normalize(c[30])
        };
    });
    updateDashboard();
});

document.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("change",updateDashboard);
});

function filterData(){
    return rawData.filter(r=>{
        let typeMatch=(typeFilter.value==="ALL"||r.type===typeFilter.value);
        let otMatch=(otFilter.value==="ALL"||r.ot===otFilter.value);
        let wardMatch=(wardFilter.value==="ALL"||r.ward===wardFilter.value);
        let genderMatch=(genderFilter.value==="ALL"||r.gender===genderFilter.value);

        let from=fromDate.value?new Date(fromDate.value):null;
        let to=toDate.value?new Date(toDate.value):null;
        let dateMatch=(!from||r.date>=from)&&(!to||r.date<=to);

        return typeMatch&&otMatch&&wardMatch&&genderMatch&&dateMatch;
    });
}

function countMajorMinor(data){
    return {
        MAJOR:data.filter(d=>d.type==="MAJOR").length,
        MINOR:data.filter(d=>d.type==="MINOR").length
    };
}

function countAnaesthesia(data){
    return {
        LOCAL:data.filter(d=>d.anaesthesia.includes("LOCAL")).length,
        SPINAL:data.filter(d=>d.anaesthesia.includes("SPINAL")).length,
        GENERAL:data.filter(d=>d.anaesthesia.includes("GENERAL")).length
    };
}

function buildPie(id,dataObj){
    if(charts[id]) charts[id].destroy();
    charts[id]=new Chart(document.getElementById(id),{
        type:'pie',
        data:{
            labels:Object.keys(dataObj),
            datasets:[{
                data:Object.values(dataObj),
                backgroundColor:["#0066cc","#00aaff","#33cc99"]
            }]
        },
        options:{plugins:{legend:{position:'bottom'}}}
    });
}

function updateDashboard(){
    const data=filterData();

    totalSurgeries.innerText=data.length;
    maleCount.innerText="Male: "+data.filter(d=>d.gender==="MALE").length;
    femaleCount.innerText="Female: "+data.filter(d=>d.gender==="FEMALE").length;

    const typeData=countMajorMinor(data);
    majorCount.innerText="Major: "+typeData.MAJOR;
    minorCount.innerText="Minor: "+typeData.MINOR;

    const anaData=countAnaesthesia(data);
    localCount.innerText="Local: "+anaData.LOCAL;
    spinalCount.innerText="Spinal: "+anaData.SPINAL;
    generalCount.innerText="General: "+anaData.GENERAL;

    execText.innerHTML="<b>Executive Summary:</b><br>Total "+data.length+
    " surgeries performed. Major: "+typeData.MAJOR+
    ", Minor: "+typeData.MINOR+
    ". Local Anaesthesia: "+anaData.LOCAL+
    ", Spinal: "+anaData.SPINAL+
    ", General: "+anaData.GENERAL+".";

    buildPie("typeChart",typeData);
    buildPie("anaChart",anaData);
}

function exportPDF(){
    html2pdf().from(summarySection).save("Executive_Summary_SAH.pdf");
}

function updateClock(){
    const now=new Date();
    clock.innerHTML=now.toLocaleString('en-US',{
        weekday:'long',year:'numeric',month:'long',day:'numeric',
        hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true
    });
}
setInterval(updateClock,1000);

</script>

</body>
</html>
