<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL - Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
margin:0;
font-family:Segoe UI,Arial;
background:linear-gradient(135deg,#e3f2fd,#ffffff);
}

.header{
text-align:center;
font-size:22px;
font-weight:bold;
padding:15px;
}

.clock{
position:absolute;
left:15px;
top:10px;
font-size:14px;
font-weight:bold;
color:#0d47a1;
}

.container{
padding:20px;
max-width:1400px;
margin:auto;
}

.filters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin-bottom:20px;
}

.filters div{
display:flex;
flex-direction:column;
}

select,input{
padding:6px;
border-radius:6px;
border:1px solid #ccc;
}

.big-kpi{
text-align:center;
font-size:30px;
font-weight:bold;
color:#0d47a1;
margin-bottom:20px;
}

.row-center{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
margin-bottom:15px;
}

.card{
background:#ffffff;
padding:12px 25px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.08);
min-width:170px;
text-align:center;
font-weight:bold;
}

.charts{
display:flex;
justify-content:center;
align-items:center;
gap:60px;
margin-top:30px;
flex-wrap:wrap;
}

.chart-box{
width:420px;
height:420px;
}

canvas{
width:100% !important;
height:100% !important;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:30px;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
}

@media print{
canvas,.buttons{
display:none;
}
body{
background:white;
}
}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="header">
DATA – SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)
</div>

<div class="container">

<div class="filters">

<div>
<label>OT</label>
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div>
<label>WARD</label>
<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div>
<label>Gender</label>
<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div>
<label>Age Group</label>
<select id="ageFilter">
<option>ALL</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div>
<label>Surgery Type</label>
<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div>
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div>
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>

<div class="big-kpi" id="totalKPI">Total Surgeries: 0</div>

<div class="row-center">
<div class="card" id="maleKPI">Male: 0</div>
<div class="card" id="femaleKPI">Female: 0</div>
</div>

<div class="row-center">
<div class="card" id="majorKPI">Major: 0</div>
<div class="card" id="minorKPI">Minor: 0</div>
</div>

<div class="row-center">
<div class="card" id="localKPI">Local: 0</div>
<div class="card" id="spinalKPI">Spinal: 0</div>
<div class="card" id="generalKPI">General: 0</div>
</div>

<div class="charts">
<div class="chart-box">
<canvas id="otChart"></canvas>
</div>
<div class="chart-box">
<canvas id="wardChart"></canvas>
</div>
</div>

<div class="buttons">
<button onclick="exportPDF()">Executive Summary Export to PDF</button>
<button onclick="location.reload()">Refresh</button>
</div>

<div class="footer">
Developed By: Software Engineer 
<a href="https://www.linkedin.com/in/smus79" target="_blank">
MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</div>

</div>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let otChart, wardChart;

function updateClock(){
let now=new Date();
clock.innerHTML=now.toLocaleDateString()+" "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);

async function loadData(){
let res=await fetch(sheetURL);
let text=await res.text();
let rows=text.split("\n").map(r=>r.split(","));
rawData=rows.slice(1);
applyFilters();
}

function clean(value){
return (value||"").toString().trim().toUpperCase();
}

function getAgeGroup(age){
age=parseFloat(age);
if(isNaN(age)) return "";
if(age<1/12) return "Below 30 Days";
if(age<1) return "1 Month to 1 Year";
if(age<=15) return "1 Year to 15 Years";
if(age<=30) return "15 to 30 Years";
if(age<=45) return "30 Years to 45 Years";
if(age<=60) return "45 Years to 60 Years";
return "65 Years & above";
}

function applyFilters(){

let filtered=rawData.filter(r=>{

let ot=r[1]?.trim();
let ward=r[2]?.trim();
let date=new Date(r[3]);
let gender=clean(r[6]);
let age=r[7];
let anesthesia=clean(r[29]);
let type=clean(r[30]);

if(otFilter.value!="ALL OTS" && ot!=otFilter.value) return false;
if(wardFilter.value!="ALL WARDS" && ward!=wardFilter.value) return false;
if(genderFilter.value!="ALL GENDERS" && gender!=genderFilter.value) return false;
if(typeFilter.value!="ALL TYPES" && type!=typeFilter.value) return false;
if(ageFilter.value!="ALL" && getAgeGroup(age)!=ageFilter.value) return false;

if(fromDate.value && date<new Date(fromDate.value)) return false;
if(toDate.value && date>new Date(toDate.value)) return false;

return true;
});

updateKPIs(filtered);
drawCharts(filtered);
}

function updateKPIs(data){

totalKPI.innerHTML="Total Surgeries: "+data.length;
maleKPI.innerHTML="Male: "+data.filter(r=>clean(r[6])=="MALE").length;
femaleKPI.innerHTML="Female: "+data.filter(r=>clean(r[6])=="FEMALE").length;

majorKPI.innerHTML="Major: "+data.filter(r=>clean(r[30])=="MAJOR").length;
minorKPI.innerHTML="Minor: "+data.filter(r=>clean(r[30])=="MINOR").length;

localKPI.innerHTML="Local: "+data.filter(r=>clean(r[29])=="LOCAL").length;
spinalKPI.innerHTML="Spinal: "+data.filter(r=>clean(r[29])=="SPINAL").length;
generalKPI.innerHTML="General: "+data.filter(r=>clean(r[29])=="GENERAL").length;
}

function groupData(data,index){
let map={};
data.forEach(r=>{
let key=r[index]?.trim();
if(!key) return;
map[key]=(map[key]||0)+1;
});
return map;
}

function createPie(canvasID,dataMap){

let total=Object.values(dataMap).reduce((a,b)=>a+b,0);

return new Chart(document.getElementById(canvasID),{
type:'pie',
data:{
labels:Object.keys(dataMap),
datasets:[{
data:Object.values(dataMap),
backgroundColor:['#42a5f5','#66bb6a','#ffa726','#ab47bc','#26c6da']
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
datalabels:{
color:'#fff',
formatter:(value,ctx)=>{
let sum=ctx.chart._metasets[0].total;
let pct=(value/sum*100).toFixed(1)+"%";
return value+" ("+pct+")";
}
},
title:{
display:true,
text:"Total: "+total
}
}
},
plugins:[ChartDataLabels]
});
}

function drawCharts(data){
if(otChart) otChart.destroy();
if(wardChart) wardChart.destroy();

otChart=createPie("otChart",groupData(data,1));
wardChart=createPie("wardChart",groupData(data,2));
}

function exportPDF(){
let opt={
margin:0.5,
filename:'Executive_Summary.pdf',
html2canvas:{scale:2},
jsPDF:{unit:'in',format:'a4',orientation:'portrait'}
};
html2pdf().set(opt).from(document.body).save();
}

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",applyFilters);
});

loadData();

</script>

</body>
</html>
