<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Punjab Health Department – Surgical Audit Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    margin:0;
    font-family:Segoe UI, Arial;
    background:#eef2f6;
}
header{
    background:#0b3c5d;
    color:white;
    text-align:center;
    padding:15px;
}
header img{ height:85px; }
.container{ padding:20px; }
.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
}
select,input{
    padding:8px;
    border-radius:5px;
    border:1px solid #bbb;
}
.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-top:20px;
}
.kpi{
    background:white;
    border-left:6px solid #0b3c5d;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
.kpi h2{ margin:0;color:#0b3c5d; }
.charts{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
    margin-top:30px;
}
.chart-box{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,.1);
}
.full{ grid-column:1/3; }
footer{
    background:#0b3c5d;
    color:white;
    text-align:center;
    padding:12px;
    margin-top:30px;
}
footer a{ color:#ffdd57; text-decoration:none; }

button{
    padding:10px 15px;
    background:#0b3c5d;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
.btn-left{ position:fixed;bottom:20px;left:20px; }
.btn-right{ position:fixed;bottom:20px;right:20px; }
</style>
</head>

<body>

<header>
<img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU">
<h2>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h2>
<h4>Punjab Health Department – Surgical Audit & Monitoring Dashboard</h4>
</header>

<div class="container" id="dashboard">

<div class="filters">
<select id="ot"></select>
<select id="ward"></select>
<select id="gender"></select>
<select id="age"></select>
<select id="type"></select>
<input type="date" id="fromDate">
<input type="date" id="toDate">
</div>

<div class="kpis">
<div class="kpi"><h2 id="total">0</h2>Total Surgeries</div>
<div class="kpi"><h2 id="majorPct">0%</h2>Major Surgery %</div>
<div class="kpi"><h2 id="mfRatio">0</h2>Male–Female Ratio</div>
<div class="kpi"><h2 id="otUtil">0</h2>OT Utilization Index</div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
<div class="chart-box full"><canvas id="trendChart"></canvas></div>
</div>

</div>

<div class="btn-left">
<button onclick="exportPDF()">Export A4 PDF</button>
</div>

<div class="btn-right">
<button onclick="location.reload()">Reload Data</button>
</div>

<footer>
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

<script>
const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[], charts={};

function setup(id,arr){
 document.getElementById(id).innerHTML=arr.map(v=>`<option>${v}</option>`).join("");
}

function initFilters(){
 setup("ot",["ALL OTS","MAIN OT","GYNAE OT","EMERGENCY OT"]);
 setup("ward",["ALL WARDS","GYNAE","ORTHO","SURGERY","EYE"]);
 setup("gender",["ALL GENDERS","MALE","FEMALE","TRANSGENDER"]);
 setup("age",["ALL AGES","Below 30 Days","1 Month to 1 Year","1 Year to 15 Years","15 to 30 Years","30 Years to 45 Years","45 Years & above"]);
 setup("type",["ALL TYPES","MAJOR","MINOR"]);
 document.querySelectorAll("select,input").forEach(e=>e.onchange=render);
}

function ageGroup(a){
 if(a<0.08) return "Below 30 Days";
 if(a<1) return "1 Month to 1 Year";
 if(a<15) return "1 Year to 15 Years";
 if(a<30) return "15 to 30 Years";
 if(a<45) return "30 Years to 45 Years";
 return "45 Years & above";
}

function render(){
 let d=rawData.filter(r=>{
  if(ot.value!="ALL OTS" && r.OT!=ot.value) return false;
  if(ward.value!="ALL WARDS" && r.WARD!=ward.value) return false;
  if(gender.value!="ALL GENDERS" && r.GENDER!=gender.value) return false;
  if(type.value!="ALL TYPES" && r.TYPE!=type.value) return false;
  if(age.value!="ALL AGES" && ageGroup(+r.AGE)!=age.value) return false;
  if(fromDate.value && new Date(r.DATE)<new Date(fromDate.value)) return false;
  if(toDate.value && new Date(r.DATE)>new Date(toDate.value)) return false;
  return true;
 });

 let male=d.filter(x=>x.GENDER=="MALE").length;
 let female=d.filter(x=>x.GENDER=="FEMALE").length;
 let major=d.filter(x=>x.TYPE=="MAJOR").length;

 total.innerText=d.length;
 majorPct.innerText=d.length?Math.round((major/d.length)*100)+"%":"0%";
 mfRatio.innerText=female? (male/female).toFixed(2):"N/A";
 otUtil.innerText=d.length? (d.length/Object.keys(count(d,"OT")).length).toFixed(1):0;

 draw("otChart","OT-wise Performance",count(d,"OT"));
 draw("wardChart","Ward-wise Load",count(d,"WARD"));
 drawTrend(d);
}

function count(d,k){
 return d.reduce((a,c)=>(a[c[k]]=(a[c[k]]||0)+1,a),{});
}

function draw(id,title,data){
 if(charts[id]) charts[id].destroy();
 charts[id]=new Chart(document.getElementById(id),{
  type:"bar",
  data:{labels:Object.keys(data),datasets:[{label:title,data:Object.values(data)}]},
  options:{plugins:{title:{display:true,text:title}}}
 });
}

function drawTrend(d){
 let m={};
 d.forEach(r=>{
  let key=r.DATE?.slice(0,7);
  if(key) m[key]=(m[key]||0)+1;
 });
 if(charts.trend) charts.trend.destroy();
 charts.trend=new Chart(trendChart,{
  type:"line",
  data:{labels:Object.keys(m),datasets:[{label:"Monthly Surgeries",data:Object.values(m)}]},
  options:{plugins:{title:{display:true,text:"Monthly Surgery Trend"}}}
 });
}

function exportPDF(){
 html2canvas(dashboard).then(c=>{
  const pdf=new jspdf.jsPDF("l","mm","a4");
  pdf.addImage(c,"PNG",10,10,277,190);
  pdf.save("PHDP_Surgical_Report.pdf");
 });
}

Papa.parse(CSV_URL,{
 download:true,
 header:true,
 complete:r=>{
  rawData=r.data;
  initFilters();
  render();
 }
});
</script>

</body>
</html>
