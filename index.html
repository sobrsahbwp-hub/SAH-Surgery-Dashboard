<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadiq Abbasi Hospital - Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
    --primary:#0b3d91;
    --accent:#1abc9c;
    --light:#f4f7fb;
}

body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(to right,#f4f7fb,#ffffff);
    color:#1a1a1a;
}

.container{
    width:95%;
    margin:auto;
}

.clock{
    text-align:center;
    font-weight:600;
    padding:10px;
    color:var(--primary);
    font-size:18px;
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:20px;
}

/* FILTERS */
.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    margin-bottom:25px;
}

.filter-group{
    display:flex;
    flex-direction:column;
}

select,input{
    padding:8px;
    border-radius:8px;
    border:1px solid #ccc;
    min-width:160px;
}

/* KPI CARDS */
.kpi-container{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.kpi-large{
    background:white;
    padding:20px 40px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    font-size:30px;
    font-weight:700;
    color:var(--primary);
    animation:fadeIn 1s ease;
}

.kpi-row{
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.kpi-card{
    background:white;
    padding:15px 25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    min-width:150px;
    text-align:center;
    transition:0.3s;
}

.kpi-card:hover{
    transform:translateY(-5px);
}

.kpi-value{
    font-size:22px;
    font-weight:bold;
    color:var(--primary);
}

/* CHARTS */
.chart-row{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
    margin-top:30px;
}

canvas{
    width:320px !important;
    height:320px !important;
}

/* BUTTONS */
.bottom-buttons{
    display:flex;
    justify-content:space-between;
    margin:30px 10px;
}

button{
    padding:10px 20px;
    background:var(--primary);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}
button:hover{
    background:#062a63;
}

footer{
    text-align:center;
    padding:15px;
    background:#e9eef7;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

@media(max-width:768px){
    canvas{
        width:260px !important;
        height:260px !important;
    }
}

@media print{
    .filters,.chart-row,.bottom-buttons{
        display:none;
    }
}
</style>
</head>

<body>
<div class="container">

<div class="clock" id="clock"></div>
<h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)</h1>

<!-- FILTERS -->
<div class="filters">
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>

<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>

<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>

<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>

<input type="date" id="fromDate">
<input type="date" id="toDate">
</div>

<!-- KPI SECTION -->
<div class="kpi-container">

<div class="kpi-large">
TOTAL SURGERIES: <span id="totalCount">0</span>
</div>

<div class="kpi-row">
<div class="kpi-card">Male<br><span class="kpi-value" id="maleCount">0</span></div>
<div class="kpi-card">Female<br><span class="kpi-value" id="femaleCount">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi-card">Major<br><span class="kpi-value" id="majorCount">0</span></div>
<div class="kpi-card">Minor<br><span class="kpi-value" id="minorCount">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi-card">Local<br><span class="kpi-value" id="localCount">0</span></div>
<div class="kpi-card">Spinal<br><span class="kpi-value" id="spinalCount">0</span></div>
<div class="kpi-card">General<br><span class="kpi-value" id="generalCount">0</span></div>
</div>

</div>

<!-- CHARTS -->
<div class="chart-row">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
</div>

<div class="chart-row">
<canvas id="typeChart"></canvas>
<canvas id="anaesthesiaChart"></canvas>
</div>

<div class="bottom-buttons">
<button onclick="exportPDF()">Export Executive Summary PDF</button>
<button onclick="location.reload()">Refresh</button>
</div>

</div>

<footer>
Developed By: <a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</a>
</footer>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";
let data=[], charts={};

fetch(sheetURL)
.then(res=>res.text())
.then(csv=>{
    const rows=csv.split("\n").slice(1);
    data=rows.map(r=>r.split(","));
    updateDashboard();
});

document.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("change",updateDashboard);
});

function animateValue(id,end){
    let start=0;
    let duration=600;
    let range=end-start;
    let stepTime=Math.abs(Math.floor(duration/range));
    let obj=document.getElementById(id);
    let timer=setInterval(()=>{
        start++;
        obj.textContent=start;
        if(start>=end) clearInterval(timer);
    },stepTime);
}

function updateDashboard(){
let filtered=data;

let total=filtered.length;
let male=filtered.filter(r=>r[6]=="MALE").length;
let female=filtered.filter(r=>r[6]=="FEMALE").length;
let major=filtered.filter(r=>r[30]=="MAJOR").length;
let minor=filtered.filter(r=>r[30]=="MINOR").length;
let local=filtered.filter(r=>r[29]=="LOCAL").length;
let spinal=filtered.filter(r=>r[29]=="SPINAL").length;
let general=filtered.filter(r=>r[29]=="GENERAL").length;

animateValue("totalCount",total);
animateValue("maleCount",male);
animateValue("femaleCount",female);
animateValue("majorCount",major);
animateValue("minorCount",minor);
animateValue("localCount",local);
animateValue("spinalCount",spinal);
animateValue("generalCount",general);

drawChart("typeChart",{Major:major,Minor:minor},"Major/Minor");
drawChart("anaesthesiaChart",{Local:local,Spinal:spinal,General:general},"Anaesthesia Type");
}

function drawChart(id,data,label){
if(charts[id]) charts[id].destroy();
charts[id]=new Chart(document.getElementById(id),{
type:'doughnut',
data:{
labels:Object.keys(data),
datasets:[{
data:Object.values(data),
backgroundColor:['#0b3d91','#1abc9c','#e74c3c']
}]
},
options:{
plugins:{title:{display:true,text:label}},
animation:{animateScale:true}
}
});
}

function exportPDF(){
html2pdf().from(document.querySelector(".kpi-container")).save("Executive_Summary.pdf");
}

function updateClock(){
let now=new Date();
document.getElementById("clock").innerText=
now.toLocaleDateString()+" | "+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
