<!8th DASHBOARD>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sadiq Abbasi Hospital – OT Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
/* ================= GENERAL ================= */
:root{
  --primary:#1e88e5;
  --bg:#f4f6fa;
  --card:#ffffff;
  --text:#333;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Segoe UI", Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* ================= HEADER ================= */
header{
  background:#fff;
  text-align:center;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}
header img{height:70px}
header h1{
  margin:8px 0 0;
  font-size:24px;
  letter-spacing:1px;
}
header p{margin:4px 0;color:#666}

/* ================= LAYOUT ================= */
.container{padding:15px}

/* ================= FILTERS ================= */
.filters{
  background:var(--card);
  padding:15px;
  border-radius:10px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:14px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.filter label{
  font-size:13px;
  font-weight:600;
  display:block;
  margin-bottom:5px;
}
.filter select,
.filter input{
  width:100%;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

/* ================= KPIs ================= */
.kpis{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
}
.kpi{
  background:var(--card);
  padding:15px;
  text-align:center;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
}
.kpi h2{
  margin:0;
  font-size:28px;
  color:var(--primary);
}
.kpi span{
  font-weight:600;
  color:#555;
}

/* ================= CHARTS ================= */
.charts{
  margin-top:25px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:25px;
  justify-items:center;
}
canvas{
  background:#fff;
  padding:12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  max-width:100%;
}

/* ================= ACTIONS ================= */
.actions{
  margin-top:25px;
  display:flex;
  justify-content:space-between;
}
.actions button{
  padding:10px 20px;
  border:none;
  border-radius:8px;
  color:#fff;
  font-size:14px;
  cursor:pointer;
}
.export{background:#2e7d32}
.refresh{background:#0277bd}

/* ================= FOOTER ================= */
footer{
  margin-top:30px;
  background:#fff;
  text-align:center;
  padding:12px;
  font-size:13px;
  box-shadow:0 -2px 6px rgba(0,0,0,.06);
}
footer a{
  color:var(--primary);
  text-decoration:none;
  font-weight:600;
}

/* ================= A4 PRINT ================= */
@media print{
  body{background:#fff}
  header,footer{box-shadow:none}
  .actions{display:none}
  canvas{page-break-inside:avoid}
  @page{
    size:A4;
    margin:12mm;
  }
}
</style>
</head>

<body>

<div id="dashboard">

<header>
  <img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU">
  <h1>SADIQ ABBASI HOSPITAL</h1>
  <p>Bahawalpur – OT & Surgery Dashboard</p>
</header>

<div class="container">

<!-- FILTERS -->
<div class="filters">
  <div class="filter">
    <label>OT</label>
    <select id="ot">
      <option value="">ALL OTS</option>
      <option>MAIN OT</option>
      <option>GYNAE OT</option>
      <option>EMERGENCY OT</option>
    </select>
  </div>

  <div class="filter">
    <label>Ward</label>
    <select id="ward">
      <option value="">ALL WARDS</option>
      <option>GYNAE</option>
      <option>ORTHO</option>
      <option>SURGERY</option>
      <option>EYE</option>
    </select>
  </div>

  <div class="filter">
    <label>Gender</label>
    <select id="gender">
      <option value="">ALL GENDERS</option>
      <option>MALE</option>
      <option>FEMALE</option>
      <option>TRANSGENDER</option>
    </select>
  </div>

  <div class="filter">
    <label>Age Group</label>
    <select id="ageGroup">
      <option value="">ALL AGES</option>
      <option value="0-0">Below 30 Days</option>
      <option value="1-1">1 Month to 1 Year</option>
      <option value="2-15">1 Year to 15 Years</option>
      <option value="15-30">15 to 30 Years</option>
      <option value="30-45">30 to 45 Years</option>
      <option value="45-200">45 Years & Above</option>
    </select>
  </div>

  <div class="filter">
    <label>Surgery Type</label>
    <select id="type">
      <option value="">ALL TYPES</option>
      <option>MAJOR</option>
      <option>MINOR</option>
    </select>
  </div>

  <div class="filter">
    <label>From Date</label>
    <input type="date">
  </div>

  <div class="filter">
    <label>To Date</label>
    <input type="date">
  </div>
</div>

<!-- KPIs -->
<div class="kpis">
  <div class="kpi"><h2 id="t">0</h2><span>Total Surgeries</span></div>
  <div class="kpi"><h2 id="m">0</h2><span>Male Surgeries</span></div>
  <div class="kpi"><h2 id="f">0</h2><span>Female Surgeries</span></div>
  <div class="kpi"><h2 id="maj">0</h2><span>Major Surgeries</span></div>
  <div class="kpi"><h2 id="min">0</h2><span>Minor Surgeries</span></div>
</div>

<!-- CHARTS -->
<div class="charts">
  <canvas id="otChart"></canvas>
  <canvas id="wardChart"></canvas>
</div>

<!-- ACTIONS -->
<div class="actions">
  <button class="export" onclick="exportPDF()">Export to PDF</button>
  <button class="refresh" onclick="location.reload()">Refresh</button>
</div>

</div>

<footer>
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

</div>

<script>
const URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";
let data=[],otC,wardC;

fetch(URL).then(r=>r.text()).then(t=>{
  let rows=t.trim().split("\n");
  let h=rows.shift().split(",");
  data=rows.map(r=>{
    let o={};r.split(",").forEach((v,i)=>o[h[i]]=v.trim());return o;
  });
  apply();
});

document.querySelectorAll("select").forEach(e=>e.onchange=apply);

function apply(){
  let f=data.filter(d=>{
    if(ot.value&&d.OT!==ot.value)return false;
    if(ward.value&&d.WARD!==ward.value)return false;
    if(gender.value&&d.GENDER!==gender.value)return false;
    if(type.value&&d.TYPE!==type.value)return false;
    if(ageGroup.value){
      let[a,b]=ageGroup.value.split("-").map(Number);
      let age=Number(d.AGE||0);
      if(age<a||age>b)return false;
    }
    return true;
  });

  t.innerText=f.length;
  m.innerText=f.filter(x=>x.GENDER==="MALE").length;
  f.innerText=f.filter(x=>x.GENDER==="FEMALE").length;
  maj.innerText=f.filter(x=>x.TYPE==="MAJOR").length;
  min.innerText=f.filter(x=>x.TYPE==="MINOR").length;

  draw("OT",f,"otChart");
  draw("WARD",f,"wardChart");
}

function draw(k,a,id){
  let c={};a.forEach(x=>c[x[k]]=(c[x[k]]||0)+1);
  let ctx=document.getElementById(id);
  if(id==="otChart"&&otC)otC.destroy();
  if(id==="wardChart"&&wardC)wardC.destroy();
  let ch=new Chart(ctx,{
    type:"bar",
    data:{labels:Object.keys(c),datasets:[{data:Object.values(c),
    backgroundColor:["#42a5f5","#66bb6a","#ffa726","#ab47bc","#ef5350"]}]},
    options:{plugins:{legend:{display:false}},responsive:true}
  });
  id==="otChart"?otC=ch:wardC=ch;
}

function exportPDF(){
  html2pdf().from(document.getElementById("dashboard"))
  .set({filename:"SAH_OT_Dashboard_A4.pdf"})
  .save();
}
</script>

</body>
</html>
