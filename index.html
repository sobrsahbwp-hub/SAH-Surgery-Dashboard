<!7th DASHBOARD>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sadiq Abbasi Hospital Dashboard</title>
<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- html2pdf for PDF export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        color: #333;
        margin: 0;
        padding: 0;
    }
    header {
        text-align: center;
        padding: 15px 10px;
    }
    header img {
        max-height: 80px;
        display: block;
        margin: 0 auto 10px auto;
    }
    header h1 {
        margin: 0;
        font-size: 22px;
        color: #0056b3;
    }
    .filters {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        background-color: #fff;
        padding: 15px 10px;
        gap: 15px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .filter-group {
        display: flex;
        flex-direction: column;
        min-width: 130px;
        flex: 1 1 120px;
    }
    .filter-group label {
        margin-bottom: 5px;
        font-weight: bold;
        font-size: 14px;
    }
    .filter-group select, .filter-group input[type=date] {
        padding: 6px;
        font-size: 13px;
    }
    .kpi-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        margin: 15px 0;
        gap: 15px;
    }
    .kpi {
        background-color: #fff;
        padding: 12px 20px;
        text-align: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        flex: 1 1 140px;
        border-radius: 8px;
    }
    .kpi h2 {
        margin: 0;
        font-size: 16px;
        color: #555;
    }
    .kpi p {
        font-size: 20px;
        margin: 5px 0 0 0;
        font-weight: bold;
        color: #0056b3;
    }
    .charts {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-around;
        gap: 20px;
        padding: 15px 10px;
    }
    canvas {
        background-color: #fff;
        padding: 12px;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        max-width: 100%;
        height: auto;
    }
    .bottom-buttons {
        display: flex;
        justify-content: space-between;
        padding: 10px 20px;
        flex-wrap: wrap;
        gap: 10px;
    }
    .bottom-buttons button {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 6px;
        border: none;
        background-color: #0056b3;
        color: white;
    }
    footer {
        background-color: #fff;
        padding: 10px;
        text-align: center;
        font-size: 12px;
        color: #555;
        border-top: 1px solid #ccc;
    }
    footer a {
        color: #0056b3;
        text-decoration: none;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .filters {
            flex-direction: column;
            align-items: center;
        }
        .kpi-container {
            flex-direction: column;
            align-items: center;
        }
        .charts {
            flex-direction: column;
            align-items: center;
        }
        .bottom-buttons {
            flex-direction: column;
            align-items: center;
        }
    }
</style>
</head>
<body>

<header>
    <img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU" alt="Sadiq Abbasi Hospital Logo">
    <h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h1>
</header>

<div class="filters">
    <div class="filter-group">
        <label for="otFilter">OT</label>
        <select id="otFilter">
            <option value="ALL">ALL OTS</option>
            <option value="MAIN OT">MAIN OT</option>
            <option value="GYNAE OT">GYNAE OT</option>
            <option value="EMERGENCY OT">EMERGENCY OT</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="wardFilter">Ward</label>
        <select id="wardFilter">
            <option value="ALL">ALL WARDS</option>
            <option value="GYNAE">GYNAE</option>
            <option value="ORTHO">ORTHO</option>
            <option value="SURGERY">SURGERY</option>
            <option value="EYE">EYE</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="genderFilter">Gender</label>
        <select id="genderFilter">
            <option value="ALL">ALL GENDERS</option>
            <option value="MALE">MALE</option>
            <option value="FEMALE">FEMALE</option>
            <option value="TRANSGENDER">TRANSGENDER</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="ageFilter">Age Group</label>
        <select id="ageFilter">
            <option value="ALL">ALL AGES</option>
            <option value="0-0.083">Below 30 Days</option>
            <option value="0.083-1">1 Month to 1 Year</option>
            <option value="1-15">1 Year to 15 Years</option>
            <option value="15-30">15 to 30 Years</option>
            <option value="30-45">30 to 45 Years</option>
            <option value="45-150">45 Years & above</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="typeFilter">Surgery Type</label>
        <select id="typeFilter">
            <option value="ALL">ALL TYPES</option>
            <option value="MAJOR">MAJOR</option>
            <option value="MINOR">MINOR</option>
        </select>
    </div>
    <div class="filter-group">
        <label for="fromDate">From Date</label>
        <input type="date" id="fromDate">
    </div>
    <div class="filter-group">
        <label for="toDate">To Date</label>
        <input type="date" id="toDate">
    </div>
</div>

<div class="kpi-container">
    <div class="kpi">
        <h2>Total Surgeries</h2>
        <p id="totalSurgeries">0</p>
    </div>
    <div class="kpi">
        <h2>Total Male Surgeries</h2>
        <p id="totalMale">0</p>
    </div>
    <div class="kpi">
        <h2>Total Female Surgeries</h2>
        <p id="totalFemale">0</p>
    </div>
    <div class="kpi">
        <h2>Total MAJOR</h2>
        <p id="totalMajor">0</p>
    </div>
    <div class="kpi">
        <h2>Total MINOR</h2>
        <p id="totalMinor">0</p>
    </div>
</div>

<div class="charts">
    <canvas id="otChart" width="400" height="300"></canvas>
    <canvas id="wardChart" width="400" height="300"></canvas>
</div>

<div class="bottom-buttons">
    <button onclick="exportPDF()">Export to PDF</button>
    <button onclick="window.location.reload()">Refresh</button>
</div>

<footer>
    Developed By: <a href="https://www.linkedin.com/in/smus79" target="_blank">Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)</a>
</footer>

<script>
let data = [];

// Load CSV from Google Sheets
async function loadData() {
    const response = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv');
    const csvText = await response.text();
    data = csvText.split('\n').slice(1).map(row => {
        const cols = row.split(',');
        return {
            date: new Date(cols[0]),
            ot: cols[1],
            ward: cols[2],
            gender: cols[3],
            age: parseFloat(cols[4]),
            type: cols[5]
        };
    });
    updateDashboard();
}

// Filter data based on dropdowns
function filterData() {
    const ot = document.getElementById('otFilter').value;
    const ward = document.getElementById('wardFilter').value;
    const gender = document.getElementById('genderFilter').value;
    const ageRange = document.getElementById('ageFilter').value;
    const type = document.getElementById('typeFilter').value;
    const fromDate = document.getElementById('fromDate').value ? new Date(document.getElementById('fromDate').value) : null;
    const toDate = document.getElementById('toDate').value ? new Date(document.getElementById('toDate').value) : null;

    return data.filter(d => 
        (ot === 'ALL' || d.ot === ot) &&
        (ward === 'ALL' || d.ward === ward) &&
        (gender === 'ALL' || d.gender.toUpperCase() === gender) &&
        (type === 'ALL' || d.type.toUpperCase() === type) &&
        (!fromDate || d.date >= fromDate) &&
        (!toDate || d.date <= toDate) &&
        (!ageRange || ageCheck(d.age, ageRange))
    );
}

// Age group check
function ageCheck(age, range) {
    const [min, max] = range.split('-').map(parseFloat);
    return age >= min && age <= max;
}

// Update KPIs and charts
let otChartInstance, wardChartInstance;
function updateDashboard() {
    const filtered = filterData();

    // KPIs
    document.getElementById('totalSurgeries').textContent = filtered.length;
    document.getElementById('totalMale').textContent = filtered.filter(d => d.gender.toUpperCase() === 'MALE').length;
    document.getElementById('totalFemale').textContent = filtered.filter(d => d.gender.toUpperCase() === 'FEMALE').length;
    document.getElementById('totalMajor').textContent = filtered.filter(d => d.type.toUpperCase() === 'MAJOR').length;
    document.getElementById('totalMinor').textContent = filtered.filter(d => d.type.toUpperCase() === 'MINOR').length;

    // OT Chart
    const otLabels = [...new Set(data.map(d=>d.ot))];
    const otCounts = otLabels.map(l => filtered.filter(d=>d.ot===l).length);
    if (otChartInstance) otChartInstance.destroy();
    otChartInstance = new Chart(document.getElementById('otChart'), {
        type: 'bar',
        data: {
            labels: otLabels,
            datasets: [{
                label: 'OT Wise Surgeries',
                data: otCounts,
                backgroundColor: ['#0056b3','#28a745','#ffc107','#dc3545']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: { enabled: true },
                legend: { display: false }
            },
            scales: { y: { beginAtZero: true } }
        }
    });

    // Ward Chart
    const wardLabels = [...new Set(data.map(d=>d.ward))];
    const wardCounts = wardLabels.map(l => filtered.filter(d=>d.ward===l).length);
    if (wardChartInstance) wardChartInstance.destroy();
    wardChartInstance = new Chart(document.getElementById('wardChart'), {
        type: 'bar',
        data: {
            labels: wardLabels,
            datasets: [{
                label: 'Ward Wise Surgeries',
                data: wardCounts,
                backgroundColor: ['#17a2b8','#6f42c1','#fd7e14','#20c997','#e83e8c']
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: { enabled: true },
                legend: { display: false }
            },
            scales: { y: { beginAtZero: true } }
        }
    });
}

// Export PDF
function exportPDF() {
    html2pdf().from(document.body).set({margin: 0.2, filename:'HospitalDashboard.pdf', html2canvas:{scale:2}}).save();
}

// Event listeners
document.querySelectorAll('select, input[type=date]').forEach(el => {
    el.addEventListener('change', updateDashboard);
});

// Load data on page load
loadData();
</script>

</body>
</html>
