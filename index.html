<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADIQ ABBASI HOSPITAL DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Segoe UI;margin:0;background:#f4f8fc;}
.header{text-align:center;font-size:24px;font-weight:bold;padding-top:15px;}
.sub{text-align:center;margin-bottom:15px;}
.clock{position:absolute;left:15px;top:10px;font-size:14px;font-weight:bold;}
.container{padding:20px;}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:20px;}
.filter-group{display:flex;flex-direction:column;}
label{font-size:13px;font-weight:600;margin-bottom:4px;}
select,input{padding:6px;border-radius:6px;border:1px solid #ccc;}
.kpi-main{text-align:center;font-size:28px;font-weight:bold;margin-bottom:10px;}
.kpi-row{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin-bottom:10px;}
.kpi{background:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,0.1);font-weight:bold;}
.chart-row{display:flex;justify-content:center;flex-wrap:wrap;gap:40px;margin-top:25px;}
canvas{max-width:320px;max-height:320px;}
.buttons{display:flex;justify-content:space-between;margin-top:25px;}
button{padding:8px 15px;border:none;border-radius:6px;background:#0066cc;color:white;cursor:pointer;}
button:hover{background:#004c99;}
.footer{text-align:center;padding:15px;font-size:14px;margin-top:20px;}
@media print{canvas,button{display:none;}}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="header">
SADIQ ABBASI HOSPITAL, BAHAWALPUR
</div>
<div class="sub">(DATA Sheet – Surgery Data)</div>

<div class="container">

<div class="filters">

<div class="filter-group">
<label>OT</label>
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div class="filter-group">
<label>WARD</label>
<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div class="filter-group">
<label>Gender</label>
<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-group">
<label>Surgery Type</label>
<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-group">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-group">
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>

<div class="kpi-main">
TOTAL SURGERIES: <span id="totalKPI">0</span>
</div>

<div class="kpi-row">
<div class="kpi">Major: <span id="majorKPI">0</span></div>
<div class="kpi">Minor: <span id="minorKPI">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi">Local: <span id="localKPI">0</span></div>
<div class="kpi">Spinal: <span id="spinalKPI">0</span></div>
<div class="kpi">General: <span id="generalKPI">0</span></div>
</div>

<div class="chart-row">
<canvas id="typeChart"></canvas>
<canvas id="anaChart"></canvas>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary</button>
<button onclick="location.reload()">Refresh</button>
</div>

</div>

<div class="footer">
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</div>

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let headers=[];
let charts={};

function updateClock(){
document.getElementById("clock").innerText=
new Date().toLocaleString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hour12:true});
}
setInterval(updateClock,1000);

fetch(csvUrl)
.then(res=>res.text())
.then(text=>{
const rows=text.split("\n").map(r=>r.split(","));
headers=rows[0].map(h=>h.trim().toUpperCase());
rawData=rows.slice(1);
applyFilters();
});

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",applyFilters);
});

function getIndex(columnName){
return headers.indexOf(columnName);
}

function applyFilters(){
let data=rawData;

const typeIndex=getIndex("TYPE");
const anaIndex=getIndex("ANAESTHESIA");
const dateIndex=getIndex("DATE");

const typeFilterValue=typeFilter.value;
const from=fromDate.value;
const to=toDate.value;

data=data.filter(r=>{
const typeValue=(r[typeIndex]||"").trim().toUpperCase();
const anaValue=(r[anaIndex]||"").trim().toUpperCase();
const date=new Date(r[dateIndex]);

return (typeFilterValue==="ALL TYPES"||typeValue===typeFilterValue)
&&(!from||date>=new Date(from))
&&(!to||date<=new Date(to));
});

updateKPIs(data,typeIndex,anaIndex);
drawCharts(data,typeIndex,anaIndex);
}

function updateKPIs(data,typeIndex,anaIndex){
totalKPI.innerText=data.length;
majorKPI.innerText=data.filter(r=>(r[typeIndex]||"").trim().toUpperCase()==="MAJOR").length;
minorKPI.innerText=data.filter(r=>(r[typeIndex]||"").trim().toUpperCase()==="MINOR").length;
localKPI.innerText=data.filter(r=>(r[anaIndex]||"").trim().toUpperCase()==="LOCAL").length;
spinalKPI.innerText=data.filter(r=>(r[anaIndex]||"").trim().toUpperCase()==="SPINAL").length;
generalKPI.innerText=data.filter(r=>(r[anaIndex]||"").trim().toUpperCase()==="GENERAL").length;
}

function countBy(data,index){
const obj={};
data.forEach(r=>{
const key=(r[index]||"Unknown").trim();
if(!key) return;
obj[key]=(obj[key]||0)+1;
});
return obj;
}

function createChart(id,data,title){
if(charts[id]) charts[id].destroy();
charts[id]=new Chart(document.getElementById(id),{
type:"pie",
data:{labels:Object.keys(data),
datasets:[{data:Object.values(data),
backgroundColor:["#007bff","#28a745","#ffc107","#dc3545","#17a2b8","#6f42c1"]}]},
options:{responsive:true,plugins:{legend:{position:"bottom"},title:{display:true,text:title}}}
});
}

function drawCharts(data,typeIndex,anaIndex){
createChart("typeChart",countBy(data,typeIndex),"Major / Minor Surgeries");
createChart("anaChart",countBy(data,anaIndex),"Anaesthesia Type");
}

function exportPDF(){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
doc.setFontSize(16);
doc.text("SADIQ ABBASI HOSPITAL, BAHAWALPUR",20,20);
doc.setFontSize(12);
doc.text("Executive Summary - Surgery Data",20,30);

let y=45;
doc.text("Total Surgeries: "+totalKPI.innerText,20,y); y+=8;
doc.text("Major: "+majorKPI.innerText,20,y); y+=8;
doc.text("Minor: "+minorKPI.innerText,20,y); y+=8;
doc.text("Local: "+localKPI.innerText,20,y); y+=8;
doc.text("Spinal: "+spinalKPI.innerText,20,y); y+=8;
doc.text("General: "+generalKPI.innerText,20,y);

doc.text("Generated on: "+new Date().toLocaleString(),20,270);
doc.save("Executive_Summary.pdf");
}
</script>

</body>
</html>
