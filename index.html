<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADIQ ABBASI HOSPITAL DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
    font-family:Segoe UI;
    margin:0;
    background:#f2f6fb;
}
.header{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    padding-top:15px;
}
.subheader{
    text-align:center;
    font-size:16px;
    margin-bottom:15px;
}
.clock{
    position:absolute;
    left:15px;
    top:10px;
    font-weight:bold;
    font-size:14px;
}
.container{padding:20px;}

.filters{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:15px;
    margin-bottom:20px;
}
.filter-group{
    display:flex;
    flex-direction:column;
}
label{
    font-size:13px;
    margin-bottom:4px;
    font-weight:600;
}
select,input{
    padding:6px;
    border-radius:6px;
    border:1px solid #ccc;
}

.kpi-main{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-bottom:10px;
}
.kpi-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:10px;
}
.kpi{
    background:white;
    padding:10px 18px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    font-weight:bold;
}

.chart-row{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:40px;
    margin-top:25px;
}
canvas{
    max-width:320px;
    max-height:320px;
}

.buttons{
    display:flex;
    justify-content:space-between;
    margin-top:25px;
}
button{
    padding:8px 15px;
    border:none;
    border-radius:6px;
    background:#0066cc;
    color:white;
    cursor:pointer;
}
button:hover{background:#004c99;}

.footer{
    text-align:center;
    padding:15px;
    font-size:14px;
    margin-top:20px;
}

@media print{
    canvas,button{display:none;}
}
</style>
</head>

<body>

<div class="clock" id="clock"></div>

<div class="header">
SADIQ ABBASI HOSPITAL, BAHAWALPUR
</div>
<div class="subheader">(DATA Sheet – Surgery Data)</div>

<div class="container">

<div class="filters">

<div class="filter-group">
<label>OT</label>
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div class="filter-group">
<label>WARD</label>
<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div class="filter-group">
<label>Gender</label>
<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-group">
<label>Age Group</label>
<select id="ageFilter">
<option>ALL AGES</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div class="filter-group">
<label>Surgery Type</label>
<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-group">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-group">
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>

<div class="kpi-main">
TOTAL SURGERIES: <span id="totalKPI">0</span>
</div>

<div class="kpi-row">
<div class="kpi">Male: <span id="maleKPI">0</span></div>
<div class="kpi">Female: <span id="femaleKPI">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi">Major: <span id="majorKPI">0</span></div>
<div class="kpi">Minor: <span id="minorKPI">0</span></div>
</div>

<div class="kpi-row">
<div class="kpi">Local: <span id="localKPI">0</span></div>
<div class="kpi">Spinal: <span id="spinalKPI">0</span></div>
<div class="kpi">General: <span id="generalKPI">0</span></div>
</div>

<div class="chart-row">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
</div>

<div class="chart-row">
<canvas id="typeChart"></canvas>
<canvas id="anaChart"></canvas>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary</button>
<button onclick="location.reload()">Refresh</button>
</div>

</div>

<div class="footer">
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</div>

<script>
const csvUrl="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let charts={};

function updateClock(){
    document.getElementById("clock").innerText=
    new Date().toLocaleString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric',hour12:true});
}
setInterval(updateClock,1000);

fetch(csvUrl)
.then(res=>res.text())
.then(text=>{
    const rows=text.split("\n").slice(1);
    rawData=rows.map(r=>r.split(","));
    applyFilters();
});

document.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("change",applyFilters);
});

function applyFilters(){
    let data=rawData;

    const ot=otFilter.value;
    const ward=wardFilter.value;
    const gender=genderFilter.value;
    const type=typeFilter.value;
    const ageGroup=ageFilter.value;
    const from=fromDate.value;
    const to=toDate.value;

    data=data.filter(r=>{
        const date=new Date(r[3]);
        const age=parseFloat(r[7]);

        return (ot==="ALL OTS"||r[1]===ot)
        &&(ward==="ALL WARDS"||r[2]===ward)
        &&(gender==="ALL GENDERS"||r[6]===gender)
        &&(type==="ALL TYPES"||r[30]===type)
        &&filterAge(age,ageGroup)
        &&(!from||date>=new Date(from))
        &&(!to||date<=new Date(to));
    });

    updateKPIs(data);
    drawCharts(data);
}

function filterAge(age,group){
    if(group==="ALL AGES") return true;
    if(group==="Below 30 Days") return age<1/12;
    if(group==="1 Month to 1 Year") return age>=1/12&&age<=1;
    if(group==="1 Year to 15 Years") return age>1&&age<=15;
    if(group==="15 to 30 Years") return age>15&&age<=30;
    if(group==="30 Years to 45 Years") return age>30&&age<=45;
    if(group==="45 Years to 60 Years") return age>45&&age<=60;
    if(group==="65 Years & above") return age>=65;
    return true;
}

function updateKPIs(data){
    totalKPI.innerText=data.length;
    maleKPI.innerText=data.filter(r=>r[6]==="MALE").length;
    femaleKPI.innerText=data.filter(r=>r[6]==="FEMALE").length;
    majorKPI.innerText=data.filter(r=>r[30]==="MAJOR").length;
    minorKPI.innerText=data.filter(r=>r[30]==="MINOR").length;
    localKPI.innerText=data.filter(r=>r[29]==="LOCAL").length;
    spinalKPI.innerText=data.filter(r=>r[29]==="SPINAL").length;
    generalKPI.innerText=data.filter(r=>r[29]==="GENERAL").length;
}

function drawCharts(data){
    createChart("otChart",countBy(data,1),"OT Wise");
    createChart("wardChart",countBy(data,2),"Ward Wise");
    createChart("typeChart",countBy(data,30),"Major / Minor");
    createChart("anaChart",countBy(data,29),"Anaesthesia Type");
}

function countBy(data,index){
    const obj={};
    data.forEach(r=>{
        const key=r[index]||"Unknown";
        obj[key]=(obj[key]||0)+1;
    });
    return obj;
}

function createChart(id,data,title){
    if(charts[id]) charts[id].destroy();

    charts[id]=new Chart(document.getElementById(id),{
        type:"pie",
        data:{
            labels:Object.keys(data),
            datasets:[{
                data:Object.values(data),
                backgroundColor:[
                "#007bff","#28a745","#ffc107",
                "#dc3545","#17a2b8","#6f42c1","#fd7e14"]
            }]
        },
        options:{
            responsive:true,
            plugins:{
                legend:{position:"bottom"},
                title:{display:true,text:title}
            }
        }
    });
}

function exportPDF(){
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF();
    doc.setFontSize(16);
    doc.text("SADIQ ABBASI HOSPITAL, BAHAWALPUR",20,20);
    doc.setFontSize(12);
    doc.text("Executive Summary - Surgery Data",20,30);

    let y=45;
    doc.text("Total Surgeries: "+totalKPI.innerText,20,y); y+=8;
    doc.text("Male: "+maleKPI.innerText,20,y); y+=8;
    doc.text("Female: "+femaleKPI.innerText,20,y); y+=8;
    doc.text("Major: "+majorKPI.innerText,20,y); y+=8;
    doc.text("Minor: "+minorKPI.innerText,20,y); y+=8;
    doc.text("Local: "+localKPI.innerText,20,y); y+=8;
    doc.text("Spinal: "+spinalKPI.innerText,20,y); y+=8;
    doc.text("General: "+generalKPI.innerText,20,y);

    doc.text("Generated on: "+new Date().toLocaleString(),20,270);
    doc.save("Executive_Summary.pdf");
}
</script>

</body>
</html>
