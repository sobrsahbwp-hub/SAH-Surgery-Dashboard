<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sadiq Abbasi Hospital Dashboard</title>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
font-family:Segoe UI, sans-serif;
margin:0;
background:#f4f7fb;
color:#222;
}

header{
text-align:center;
padding:10px;
position:relative;
}

#clock{
position:absolute;
left:15px;
top:10px;
font-size:14px;
font-weight:600;
color:#004a99;
}

h1{
margin:20px 0 10px 0;
color:#003366;
}

.filters{
display:grid;
grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.filter-group{
display:flex;
flex-direction:column;
}

label{
font-weight:600;
margin-bottom:5px;
font-size:14px;
}

select,input{
padding:6px;
border-radius:6px;
border:1px solid #ccc;
}

.kpis{
text-align:center;
padding:10px;
}

.kpi-large{
font-size:28px;
font-weight:bold;
color:#003366;
margin-bottom:10px;
}

.kpi-row{
display:flex;
justify-content:center;
gap:40px;
flex-wrap:wrap;
margin:6px 0;
}

.kpi-box{
background:white;
padding:8px 15px;
border-radius:8px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.charts{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:50px;
padding:20px;
}

canvas{
max-width:350px;
}

.bottom-bar{
display:flex;
justify-content:space-between;
padding:20px;
}

footer{
text-align:center;
padding:15px;
background:#e9eef5;
font-size:14px;
}

@media print{
body{background:white;}
.bottom-bar, footer{display:none;}
}

</style>
</head>

<body>

<header>
<div id="clock"></div>
<h1>DATA of SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)</h1>
</header>

<div class="filters">
<div class="filter-group">
<label>OT</label>
<select id="ot">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div class="filter-group">
<label>WARD</label>
<select id="ward">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div class="filter-group">
<label>Gender</label>
<select id="gender">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-group">
<label>Age Group</label>
<select id="ageGroup">
<option>ALL</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div class="filter-group">
<label>Surgery Type</label>
<select id="type">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-group">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-group">
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<div class="kpis">
<div class="kpi-large" id="totalSurgeries">TOTAL SURGERIES: 0</div>

<div class="kpi-row">
<div class="kpi-box" id="maleKPI">Male: 0</div>
<div class="kpi-box" id="femaleKPI">Female: 0</div>
</div>

<div class="kpi-row">
<div class="kpi-box" id="majorKPI">Major: 0</div>
<div class="kpi-box" id="minorKPI">Minor: 0</div>
</div>

<div class="kpi-row">
<div class="kpi-box" id="localKPI">Local: 0</div>
<div class="kpi-box" id="spinalKPI">Spinal: 0</div>
<div class="kpi-box" id="generalKPI">General: 0</div>
</div>
</div>

<div class="charts">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
</div>

<div class="bottom-bar">
<button onclick="exportPDF()">Executive Summary Export to PDF</button>
<button onclick="location.reload()">Refresh</button>
</div>

<footer>
Developed By: <a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED</a> 
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

<script>
const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let otChart, wardChart;

// Clock
setInterval(()=>{
const now=new Date();
document.getElementById("clock").innerHTML=
now.toLocaleString("en-US",{weekday:'long',year:'numeric',month:'long',day:'numeric'})+
" | "+now.toLocaleTimeString('en-US',{hour12:true});
},1000);

// Fetch Data
fetch(sheetURL)
.then(res=>res.text())
.then(text=>{
const rows=text.split("\n").slice(1);
rawData=rows.map(r=>r.split(","));
updateDashboard();
});

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",updateDashboard);
});

function ageMatch(age,group){
age=parseInt(age);
if(!age)return true;
switch(group){
case "Below 30 Days": return age<1;
case "1 Month to 1 Year": return age>=1 && age<2;
case "1 Year to 15 Years": return age>=2 && age<=15;
case "15 to 30 Years": return age>15 && age<=30;
case "30 Years to 45 Years": return age>30 && age<=45;
case "45 Years to 60 Years": return age>45 && age<=60;
case "65 Years & above": return age>=65;
default:return true;
}
}

function updateDashboard(){
const ot=document.getElementById("ot").value;
const ward=document.getElementById("ward").value;
const gender=document.getElementById("gender").value;
const ageGroup=document.getElementById("ageGroup").value;
const type=document.getElementById("type").value;
const fromDate=document.getElementById("fromDate").value;
const toDate=document.getElementById("toDate").value;

let filtered=rawData.filter(r=>{
let d=new Date(r[3]);
return (ot==="ALL OTS"||r[1]===ot) &&
(ward==="ALL WARDS"||r[2]===ward) &&
(gender==="ALL GENDERS"||r[6]===gender) &&
(type==="ALL TYPES"||r[30]===type) &&
(ageGroup==="ALL"||ageMatch(r[7],ageGroup)) &&
(!fromDate||d>=new Date(fromDate)) &&
(!toDate||d<=new Date(toDate));
});

let total=filtered.length;
let male=filtered.filter(r=>r[6]==="MALE").length;
let female=filtered.filter(r=>r[6]==="FEMALE").length;
let major=filtered.filter(r=>r[30]==="MAJOR").length;
let minor=filtered.filter(r=>r[30]==="MINOR").length;
let local=filtered.filter(r=>r[29]==="LOCAL").length;
let spinal=filtered.filter(r=>r[29]==="SPINAL").length;
let general=filtered.filter(r=>r[29]==="GENERAL").length;

document.getElementById("totalSurgeries").innerHTML="TOTAL SURGERIES: "+total;
document.getElementById("maleKPI").innerHTML="Male: "+male;
document.getElementById("femaleKPI").innerHTML="Female: "+female;
document.getElementById("majorKPI").innerHTML="Major: "+major;
document.getElementById("minorKPI").innerHTML="Minor: "+minor;
document.getElementById("localKPI").innerHTML="Local: "+local;
document.getElementById("spinalKPI").innerHTML="Spinal: "+spinal;
document.getElementById("generalKPI").innerHTML="General: "+general;

let otData={}, wardData={};
filtered.forEach(r=>{
otData[r[1]]=(otData[r[1]]||0)+1;
wardData[r[2]]=(wardData[r[2]]||0)+1;
});

drawChart("otChart",otData,"OT Wise Surgeries");
drawChart("wardChart",wardData,"Ward Wise Surgeries");
}

function drawChart(id,data,label){
if(window[id]) window[id].destroy();
const ctx=document.getElementById(id).getContext("2d");
window[id]=new Chart(ctx,{
type:"pie",
data:{
labels:Object.keys(data),
datasets:[{
data:Object.values(data),
backgroundColor:["#4e73df","#1cc88a","#36b9cc","#f6c23e","#e74a3b"]
}]
},
options:{
plugins:{
title:{display:true,text:label},
legend:{position:"bottom"}
}
}
});
}

function exportPDF(){
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
doc.setFontSize(14);
doc.text("SADIQ ABBASI HOSPITAL, BAHAWALPUR",20,20);
doc.setFontSize(12);
doc.text(document.getElementById("totalSurgeries").innerText,20,40);
doc.text(document.getElementById("maleKPI").innerText+" | "+document.getElementById("femaleKPI").innerText,20,50);
doc.text(document.getElementById("majorKPI").innerText+" | "+document.getElementById("minorKPI").innerText,20,60);
doc.text(document.getElementById("localKPI").innerText+" | "+document.getElementById("spinalKPI").innerText+" | "+document.getElementById("generalKPI").innerText,20,70);
doc.text("Executive Summary:",20,90);
doc.text("This report summarizes surgery data based on selected criteria filters.",20,100);
doc.text("Generated on: "+new Date().toLocaleString(),20,120);
doc.text("Developed By: MUHAMMAD UMAIR SYED",20,280);
doc.save("Executive_Summary.pdf");
}

</script>

</body>
</html>
