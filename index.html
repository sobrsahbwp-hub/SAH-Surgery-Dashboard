<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL – SURGICAL DASHBOARD</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: 'Segoe UI', Arial;
    background: #f4f6f9;
    margin: 0;
}
header {
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color: white;
    text-align: center;
    padding: 15px;
}
header img {
    max-height: 90px;
}
.container {
    padding: 20px;
}
.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap: 10px;
}
select, input {
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
}
.kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap: 15px;
    margin-top: 20px;
}
.kpi {
    background: white;
    padding: 15px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0,0,0,.1);
}
.kpi h2 {
    margin: 0;
    color: #2c5364;
}
.charts {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap: 20px;
    margin-top: 30px;
}
canvas {
    background: white;
    border-radius: 10px;
    padding: 10px;
}
footer {
    text-align: center;
    padding: 15px;
    background: #203a43;
    color: white;
    margin-top: 30px;
}
footer a { color: #ffd700; text-decoration: none; }
.export {
    position: fixed;
    bottom: 20px;
    left: 20px;
}
.export button {
    padding: 10px 15px;
    background: #2c5364;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU">
    <h2>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h2>
    <h4>Surgical Audit Dashboard</h4>
</header>

<div class="container" id="dashboard">

<div class="filters">
<select id="ot"></select>
<select id="ward"></select>
<select id="gender"></select>
<select id="age"></select>
<select id="type"></select>
<input type="date" id="fromDate">
<input type="date" id="toDate">
</div>

<div class="kpis">
<div class="kpi"><h2 id="total">0</h2>Total Surgeries</div>
<div class="kpi"><h2 id="male">0</h2>Male</div>
<div class="kpi"><h2 id="female">0</h2>Female</div>
<div class="kpi"><h2 id="major">0</h2>Major</div>
<div class="kpi"><h2 id="minor">0</h2>Minor</div>
</div>

<div class="charts">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
<canvas id="genderChart"></canvas>
</div>

</div>

<div class="export">
<button onclick="exportPDF()">Export to PDF</button>
</div>

<footer>
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData = [], charts = {};

function ageGroup(age){
 if(age < 0.08) return "Below 30 Days";
 if(age < 1) return "1 Month to 1 Year";
 if(age < 15) return "1 Year to 15 Years";
 if(age < 30) return "15 to 30 Years";
 if(age < 45) return "30 Years to 45 Years";
 return "45 Years & above";
}

function populateFilters(){
 const make = (id,arr)=> {
  let s=document.getElementById(id);
  s.innerHTML=arr.map(v=>`<option>${v}</option>`).join("");
 };
 make("ot",["ALL OTS","MAIN OT","GYNAE OT","EMERGENCY OT"]);
 make("ward",["ALL WARDS","GYNAE","ORTHO","SURGERY","EYE"]);
 make("gender",["ALL GENDERS","MALE","FEMALE","TRANSGENDER"]);
 make("age",["ALL AGES","Below 30 Days","1 Month to 1 Year","1 Year to 15 Years","15 to 30 Years","30 Years to 45 Years","45 Years & above"]);
 make("type",["ALL TYPES","MAJOR","MINOR"]);
 document.querySelectorAll("select,input").forEach(e=>e.onchange=render);
}

function render(){
 let d = rawData.filter(r=>{
  if(ot.value!="ALL OTS" && r.OT!=ot.value) return false;
  if(ward.value!="ALL WARDS" && r.WARD!=ward.value) return false;
  if(gender.value!="ALL GENDERS" && r.GENDER!=gender.value) return false;
  if(type.value!="ALL TYPES" && r.TYPE!=type.value) return false;
  if(age.value!="ALL AGES" && ageGroup(+r.AGE)!=age.value) return false;
  if(fromDate.value && new Date(r.DATE)<new Date(fromDate.value)) return false;
  if(toDate.value && new Date(r.DATE)>new Date(toDate.value)) return false;
  return true;
 });

 total.innerText=d.length;
 male.innerText=d.filter(x=>x.GENDER=="MALE").length;
 female.innerText=d.filter(x=>x.GENDER=="FEMALE").length;
 major.innerText=d.filter(x=>x.TYPE=="MAJOR").length;
 minor.innerText=d.filter(x=>x.TYPE=="MINOR").length;

 drawChart("otChart","pie","OT Wise",count(d,"OT"));
 drawChart("wardChart","pie","Ward Wise",count(d,"WARD"));
 drawChart("genderChart","bar","Gender Wise",count(d,"GENDER"));
}

function count(data,key){
 return data.reduce((a,c)=>(a[c[key]]=(a[c[key]]||0)+1,a),{});
}

function drawChart(id,type,label,data){
 if(charts[id]) charts[id].destroy();
 charts[id]=new Chart(document.getElementById(id),{
  type:type,
  data:{labels:Object.keys(data),datasets:[{data:Object.values(data)}]},
  options:{plugins:{title:{display:true,text:label}}}
 });
}

function exportPDF(){
 html2canvas(document.getElementById("dashboard")).then(c=>{
  const pdf=new jspdf.jsPDF("l","mm","a4");
  pdf.addImage(c,"PNG",10,10,277,190);
  pdf.save("Surgical_Dashboard.pdf");
 });
}

Papa.parse(CSV_URL,{
 download:true,
 header:true,
 complete:r=>{
  rawData=r.data;
  populateFilters();
  render();
 }
});
</script>

</body>
</html>
