<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL – Surgical Executive Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI,Arial;background:#f1f5f9;color:#1e293b;}

header{
background:#e2e8f0;
padding:15px;
display:flex;
justify-content:center;
align-items:center;
position:relative;
}

header img{height:75px;}
header h1{margin:0;font-size:22px;color:#1e3a8a;text-align:center;}

#clock{
position:absolute;
right:20px;
top:20px;
font-weight:600;
font-size:14px;
}

.container{padding:20px;}

.filters{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:12px;
margin-bottom:25px;
}

.filter-box label{
font-size:12px;
font-weight:600;
color:#1e40af;
}

.filter-box select,
.filter-box input{
width:100%;
padding:8px;
border-radius:6px;
border:1px solid #cbd5e1;
}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
margin-bottom:30px;
}

.kpi{
background:white;
padding:18px;
border-radius:12px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

.kpi h2{margin:0;font-size:26px;color:#2563eb;}

.charts{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
}

.chart-box{
background:white;
padding:20px;
border-radius:12px;
width:100%;
max-width:500px;
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

footer{
margin-top:30px;
background:#e2e8f0;
padding:12px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
padding:8px 14px;
border:none;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

#pdfBtn{background:#16a34a;color:white;}
#reloadBtn{background:#2563eb;color:white;}

@media(max-width:768px){
header{flex-direction:column;}
#clock{position:static;margin-top:8px;}
footer{flex-direction:column;gap:8px;text-align:center;}
}
</style>
</head>

<body>

<header>
<div style="text-align:center;">
<img src="https://drive.google.com/uc?export=view&id=1Y5PbMKEFDgSk9CiSZOAdVyxRyAse6hXU">
<h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h1>
</div>
<div id="clock"></div>
</header>

<div class="container" id="dashboard">

<div class="filters">
<div class="filter-box">
<label>OT</label>
<select id="otFilter"><option value="">ALL</option></select>
</div>

<div class="filter-box">
<label>Ward</label>
<select id="wardFilter"><option value="">ALL</option></select>
</div>

<div class="filter-box">
<label>Gender</label>
<select id="genderFilter">
<option value="">ALL</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option value="">ALL</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<div class="kpis">
<div class="kpi"><h2 id="total">0</h2><p>Total</p></div>
<div class="kpi"><h2 id="male">0</h2><p>Male</p></div>
<div class="kpi"><h2 id="female">0</h2><p>Female</p></div>
<div class="kpi"><h2 id="major">0</h2><p>Major</p></div>
<div class="kpi"><h2 id="minor">0</h2><p>Minor</p></div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
<div class="chart-box"><canvas id="pieChart"></canvas></div>
</div>

</div>

<footer>
<button id="pdfBtn" onclick="exportExecutivePDF()">Executive Summary PDF</button>
<div>IT Department – Sadiq Abbasi Hospital</div>
<button id="reloadBtn" onclick="location.reload()">Reload</button>
</footer>

<script>
const csvUrl="YOUR_CSV_LINK_HERE";

let rawData=[];
let otChart,wardChart,pieChart;
let lastFiltered=[];

/* CLOCK */
setInterval(()=>{
document.getElementById("clock").innerText=
new Date().toLocaleDateString()+" | "+new Date().toLocaleTimeString();
},1000);

/* FETCH DATA */
Papa.parse(csvUrl,{
download:true,
header:true,
skipEmptyLines:true,
complete:res=>{
rawData=res.data.map(r=>{
let clean={};
Object.keys(r).forEach(k=>{
clean[k.trim().toUpperCase()]=r[k]?.toString().trim().toUpperCase();
});
return clean;
});
populateFilters();
updateDashboard();
}
});

document.querySelectorAll("select,input").forEach(el=>{
el.addEventListener("change",updateDashboard);
});

function populateFilters(){
[...new Set(rawData.map(r=>r.OT).filter(Boolean))].forEach(v=>{
otFilter.innerHTML+=`<option>${v}</option>`;
});
[...new Set(rawData.map(r=>r.WARD).filter(Boolean))].forEach(v=>{
wardFilter.innerHTML+=`<option>${v}</option>`;
});
}

function updateDashboard(){

const from=fromDate.value;
const to=toDate.value;

const filtered=rawData.filter(r=>{

if(otFilter.value && r.OT!==otFilter.value) return false;
if(wardFilter.value && r.WARD!==wardFilter.value) return false;
if(genderFilter.value && r.GENDER!==genderFilter.value) return false;
if(typeFilter.value && r.TYPE!==typeFilter.value) return false;

if(from && new Date(r.DATE)<new Date(from)) return false;
if(to && new Date(r.DATE)>new Date(to)) return false;

return true;
});

lastFiltered=filtered;

/* KPI CALCULATIONS */
const majorCount=filtered.filter(r=>r.TYPE==="MAJOR").length;
const minorCount=filtered.filter(r=>r.TYPE==="MINOR").length;

total.innerText=filtered.length;
male.innerText=filtered.filter(r=>r.GENDER==="MALE").length;
female.innerText=filtered.filter(r=>r.GENDER==="FEMALE").length;
major.innerText=majorCount;
minor.innerText=minorCount;

/* DRAW CHARTS */
drawBarChart("otChart",group(filtered,"OT"),otChart,c=>otChart=c);
drawBarChart("wardChart",group(filtered,"WARD"),wardChart,c=>wardChart=c);
drawPieChart("pieChart",majorCount,minorCount);
}

function group(data,key){
const obj={};
data.forEach(r=>{
if(r[key]){
obj[r[key]]=(obj[r[key]]||0)+1;
}
});
return obj;
}

function drawBarChart(id,data,chart,setChart){
if(chart) chart.destroy();

setChart(new Chart(document.getElementById(id),{
type:"bar",
data:{
labels:Object.keys(data),
datasets:[{
data:Object.values(data),
backgroundColor:"#2563eb"
}]
},
options:{responsive:true,plugins:{legend:{display:false}}}
}));
}

function drawPieChart(id,majorCount,minorCount){
if(pieChart) pieChart.destroy();

pieChart=new Chart(document.getElementById(id),{
type:"pie",
data:{
labels:["MAJOR","MINOR"],
datasets:[{
data:[majorCount,minorCount],
backgroundColor:["#16a34a","#f43f5e"]
}]
},
options:{responsive:true}
});
}

/* EXECUTIV*
