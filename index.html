<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL - Surgery Data Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#eef6ff,#f9fcff);
    color:#1a1a1a;
}

/* CLOCK BAR */
.clock-bar{
    display:flex;
    justify-content:center;
    gap:60px;
    padding:12px;
    background:#0d47a1;
    color:white;
    font-weight:600;
}
.clock-box{
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* MAIN HEADER */
header{
    text-align:center;
    padding:18px;
    font-size:24px;
    font-weight:800;
    color:#0d47a1;
    letter-spacing:0.5px;
}

/* CARD SECTIONS */
.section{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:14px;
    box-shadow:0 8px 25px rgba(0,0,0,0.07);
}

.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:18px;
}
.filter-box{
    display:flex;
    flex-direction:column;
    min-width:160px;
}
label{
    font-size:13px;
    font-weight:600;
    margin-bottom:4px;
}
select,input{
    padding:7px;
    border-radius:6px;
    border:1px solid #cfd8dc;
}

/* KPIs */
.kpis{text-align:center;}
.kpi-big{
    font-size:44px;
    font-weight:900;
    color:#0d47a1;
}
.kpi-row{
    display:flex;
    justify-content:center;
    gap:60px;
    margin-top:12px;
    flex-wrap:wrap;
}
.kpi{font-weight:600;font-size:15px;}

/* CHARTS */
.chart-row{
    display:flex;
    justify-content:center;
    gap:60px;
    flex-wrap:wrap;
    margin-top:20px;
}
.chart-box{
    width:320px;
    height:320px;
}

/* BUTTONS */
.buttons{
    display:flex;
    justify-content:space-between;
    margin:20px;
}
button{
    padding:9px 16px;
    border:none;
    border-radius:6px;
    background:#0d47a1;
    color:white;
    cursor:pointer;
}
button:hover{background:#08306b;}

footer{
    text-align:center;
    padding:12px;
    font-size:13px;
    background:#0d47a1;
    color:white;
}
footer a{color:#bbdefb;}

@media(max-width:768px){
    .chart-row{flex-direction:column;align-items:center;}
    .clock-bar{flex-direction:column;gap:10px;}
}
@media print{
    body{width:210mm;height:297mm;}
}
</style>
</head>

<body>

<!-- PROFESSIONAL TWO COLUMN CLOCK -->
<div class="clock-bar">
    <div class="clock-box">
        <div>Current Date</div>
        <div id="dateDisplay"></div>
    </div>
    <div class="clock-box">
        <div>Current Time</div>
        <div id="timeDisplay"></div>
    </div>
</div>

<header>
SADIQ ABBASI HOSPITAL, BAHAWALPUR - Surgery Data Dashboard
</header>

<div class="section">
<div class="filters">

<div class="filter-box">
<label>OT</label>
<select id="otFilter">
<option value="ALL">ALL OTS</option>
<option value="MAIN OT">MAIN OT</option>
<option value="GYNAE OT">GYNAE OT</option>
</select>
</div>

<div class="filter-box">
<label>WARD</label>
<select id="wardFilter">
<option value="ALL">ALL WARDS</option>
<option value="GYNAE">GYNAE</option>
<option value="ORTHO">ORTHO</option>
<option value="SURGERY">SURGERY</option>
<option value="EYE">EYE</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option value="ALL">ALL TYPES</option>
<option value="MAJOR">MAJOR</option>
<option value="MINOR">MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>
</div>

<div class="section kpis" id="summarySection">
<div class="kpi-big" id="totalSurgeries">0</div>
<div><b>Total Surgeries</b></div>

<div class="kpi-row">
<div class="kpi" id="majorCount">Major: 0</div>
<div class="kpi" id="minorCount">Minor: 0</div>
</div>

<div class="kpi-row">
<div class="kpi" id="localCount">Local: 0</div>
<div class="kpi" id="spinalCount">Spinal: 0</div>
<div class="kpi" id="generalCount">General: 0</div>
</div>

<br>
<div id="execText" style="max-width:800px;margin:auto;font-size:14px;"></div>
</div>

<div class="section">
<div class="chart-row">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
</div>

<div class="chart-row">
<div class="chart-box"><canvas id="typeChart"></canvas></div>
<div class="chart-box"><canvas id="anaChart"></canvas></div>
</div>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary</button>
<button onclick="location.reload()">Refresh</button>
</div>

<footer>
Developed By:
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</a>
</footer>

<script>
Chart.register(ChartDataLabels);

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let charts={};

function normalize(v){return v? v.trim().toUpperCase():"";}

fetch(sheetURL)
.then(r=>r.text())
.then(csv=>{
    const rows=csv.split("\n").slice(1);
    rawData=rows.map(row=>{
        const c=row.split(",");
        return{
            ot:normalize(c[1]),
            ward:normalize(c[2]),
            date:new Date(c[3]),
            anaesthesia:normalize(c[29]),
            type:normalize(c[30])
        };
    });
    updateDashboard();
});

document.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("change",updateDashboard);
});

function filterData(){
    return rawData.filter(r=>{
        let typeMatch=(typeFilter.value==="ALL"||r.type===typeFilter.value);
        let otMatch=(otFilter.value==="ALL"||r.ot===otFilter.value);
        let wardMatch=(wardFilter.value==="ALL"||r.ward===wardFilter.value);
        let from=fromDate.value?new Date(fromDate.value):null;
        let to=toDate.value?new Date(toDate.value):null;
        let dateMatch=(!from||r.date>=from)&&(!to||r.date<=to);
        return typeMatch&&otMatch&&wardMatch&&dateMatch;
    });
}

function countBy(data,key){
    return data.reduce((a,b)=>{
        if(!b[key]) return a;
        a[b[key]]=(a[b[key]]||0)+1;
        return a;
    },{});
}

function buildPie(id,dataObj){
    if(charts[id]) charts[id].destroy();
    charts[id]=new Chart(document.getElementById(id),{
        type:'pie',
        data:{
            labels:Object.keys(dataObj),
            datasets:[{
                data:Object.values(dataObj),
                backgroundColor:[
                    "#1565c0","#42a5f5","#26c6da",
                    "#66bb6a","#ffa726","#ef5350",
                    "#ab47bc","#8d6e63"
                ]
            }]
        },
        options:{
            plugins:{
                legend:{position:'bottom'},
                datalabels:{
                    color:'#fff',
                    font:{weight:'bold'},
                    formatter:(value)=>value
                }
            }
        }
    });
}

function updateDashboard(){
    const data=filterData();
    totalSurgeries.innerText=data.length;

    const typeData=countBy(data,"type");
    const anaData=countBy(data,"anaesthesia");

    majorCount.innerText="Major: "+(typeData.MAJOR||0);
    minorCount.innerText="Minor: "+(typeData.MINOR||0);

    localCount.innerText="Local: "+(anaData.LOCAL||0);
    spinalCount.innerText="Spinal: "+(anaData.SPINAL||0);
    generalCount.innerText="General: "+(anaData.GENERAL||0);

    execText.innerHTML="<b>Executive Summary:</b><br>Total "+data.length+
    " surgeries recorded. Major: "+(typeData.MAJOR||0)+
    ", Minor: "+(typeData.MINOR||0)+
    ". Local: "+(anaData.LOCAL||0)+
    ", Spinal: "+(anaData.SPINAL||0)+
    ", General: "+(anaData.GENERAL||0)+".";

    buildPie("otChart",countBy(data,"ot"));
    buildPie("wardChart",countBy(data,"ward"));
    buildPie("typeChart",typeData);
    buildPie("anaChart",anaData);
}

function exportPDF(){
    html2pdf().from(summarySection).save("Executive_Summary_SAH.pdf");
}

function updateClock(){
    const now=new Date();
    dateDisplay.innerHTML=now.toLocaleDateString('en-US',{
        weekday:'long',year:'numeric',month:'long',day:'numeric'
    });
    timeDisplay.innerHTML=now.toLocaleTimeString('en-US',{
        hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true
    });
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
