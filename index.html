<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL - Surgery Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{
    font-family: 'Segoe UI', sans-serif;
    margin:0;
    background:#f4f8fb;
    color:#222;
}
header{
    text-align:center;
    padding:20px;
    font-size:22px;
    font-weight:bold;
}
#clock{
    position:absolute;
    right:20px;
    top:20px;
    font-size:14px;
    font-weight:600;
}
.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:15px;
}
.filter-box{
    display:flex;
    flex-direction:column;
    min-width:150px;
}
select,input{
    padding:6px;
    border:1px solid #ccc;
    border-radius:5px;
}
.kpis{
    text-align:center;
    padding:10px;
}
.kpi-big{
    font-size:36px;
    font-weight:bold;
    color:#0077cc;
}
.kpi-row{
    display:flex;
    justify-content:center;
    gap:40px;
    margin-top:10px;
}
.kpi{
    font-size:16px;
    font-weight:600;
}
.chart-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:40px;
    margin:20px 0;
}
canvas{
    max-width:450px;
}
.buttons{
    display:flex;
    justify-content:space-between;
    padding:20px;
}
footer{
    text-align:center;
    padding:10px;
    font-size:13px;
    background:#e9eef3;
}
@media print{
    body{width:210mm;height:297mm;}
}
@media(max-width:768px){
    .chart-row{flex-direction:column;align-items:center;}
}
</style>
</head>

<body>

<header>
DATA of SADIQ ABBASI HOSPITAL, BAHAWALPUR (Surgery Data)
<div id="clock"></div>
</header>

<div class="filters">
<div class="filter-box">
<label>OT</label>
<select id="otFilter">
<option>ALL OTS</option>
<option>MAIN OT</option>
<option>GYNAE OT</option>
</select>
</div>

<div class="filter-box">
<label>WARD</label>
<select id="wardFilter">
<option>ALL WARDS</option>
<option>GYNAE</option>
<option>ORTHO</option>
<option>SURGERY</option>
<option>EYE</option>
</select>
</div>

<div class="filter-box">
<label>Gender</label>
<select id="genderFilter">
<option>ALL GENDERS</option>
<option>MALE</option>
<option>FEMALE</option>
<option>TRANSGENDER</option>
</select>
</div>

<div class="filter-box">
<label>Age Group</label>
<select id="ageFilter">
<option>ALL</option>
<option>Below 30 Days</option>
<option>1 Month to 1 Year</option>
<option>1 Year to 15 Years</option>
<option>15 to 30 Years</option>
<option>30 Years to 45 Years</option>
<option>45 Years to 60 Years</option>
<option>65 Years & above</option>
</select>
</div>

<div class="filter-box">
<label>Surgery Type</label>
<select id="typeFilter">
<option>ALL TYPES</option>
<option>MAJOR</option>
<option>MINOR</option>
</select>
</div>

<div class="filter-box">
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div class="filter-box">
<label>To Date</label>
<input type="date" id="toDate">
</div>

</div>

<div class="kpis" id="summarySection">
<div class="kpi-big" id="totalSurgeries">0</div>
<div>Total Surgeries</div>

<div class="kpi-row">
<div class="kpi" id="maleCount">Male: 0</div>
<div class="kpi" id="femaleCount">Female: 0</div>
</div>

<div class="kpi-row">
<div class="kpi" id="majorCount">Major: 0</div>
<div class="kpi" id="minorCount">Minor: 0</div>
</div>

<div class="kpi-row">
<div class="kpi" id="localCount">Local: 0</div>
<div class="kpi" id="spinalCount">Spinal: 0</div>
<div class="kpi" id="generalCount">General: 0</div>
</div>
</div>

<div class="chart-row">
<canvas id="otChart"></canvas>
<canvas id="wardChart"></canvas>
</div>

<div class="chart-row">
<canvas id="typeChart"></canvas>
<canvas id="anaesthesiaChart"></canvas>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary to PDF</button>
<button onclick="location.reload()">Refresh</button>
</div>

<footer>
Developed By: 
<a href="https://www.linkedin.com/in/smus79" target="_blank">
Software Engineer MUHAMMAD UMAIR SYED (IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</a>
</footer>

<script>

let rawData=[];
let otChart, wardChart, typeChart, anaesthesiaChart;

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

fetch(sheetURL)
.then(res=>res.text())
.then(data=>{
    const rows=data.split("\n").slice(1);
    rawData=rows.map(r=>{
        const cols=r.split(",");
        return{
            ot:cols[1],
            ward:cols[2],
            date:new Date(cols[3]),
            gender:cols[6],
            age:parseInt(cols[7]),
            anaesthesia:cols[29],
            type:cols[30]
        }
    });
    updateDashboard();
});

document.querySelectorAll("select,input").forEach(el=>{
    el.addEventListener("change",updateDashboard);
});

function filterData(){
    return rawData.filter(r=>{
        let otF=otFilter.value==="ALL OTS"||r.ot===otFilter.value;
        let wardF=wardFilter.value==="ALL WARDS"||r.ward===wardFilter.value;
        let genderF=genderFilter.value==="ALL GENDERS"||r.gender===genderFilter.value;
        let typeF=typeFilter.value==="ALL TYPES"||r.type===typeFilter.value;

        let from=fromDate.value?new Date(fromDate.value):null;
        let to=toDate.value?new Date(toDate.value):null;
        let dateF=(!from||r.date>=from)&&(!to||r.date<=to);

        return otF&&wardF&&genderF&&typeF&&dateF;
    });
}

function updateDashboard(){
    const data=filterData();

    totalSurgeries.innerText=data.length;

    maleCount.innerText="Male: "+data.filter(d=>d.gender==="MALE").length;
    femaleCount.innerText="Female: "+data.filter(d=>d.gender==="FEMALE").length;

    majorCount.innerText="Major: "+data.filter(d=>d.type==="MAJOR").length;
    minorCount.innerText="Minor: "+data.filter(d=>d.type==="MINOR").length;

    localCount.innerText="Local: "+data.filter(d=>d.anaesthesia==="LOCAL").length;
    spinalCount.innerText="Spinal: "+data.filter(d=>d.anaesthesia==="SPINAL").length;
    generalCount.innerText="General: "+data.filter(d=>d.anaesthesia==="GENERAL").length;

    buildCharts(data);
}

function buildCharts(data){

    const countBy=(key)=>{
        return data.reduce((acc,d)=>{
            acc[d[key]]=(acc[d[key]]||0)+1;
            return acc;
        },{});
    }

    const createChart=(ctx,label,dataObj)=>{
        return new Chart(ctx,{
            type:'bar',
            data:{
                labels:Object.keys(dataObj),
                datasets:[{
                    label:label,
                    data:Object.values(dataObj),
                    backgroundColor:['#0077cc','#00aaff','#66c2ff','#99d6ff','#cceeff']
                }]
            },
            options:{responsive:true,plugins:{legend:{display:false}}}
        });
    }

    if(otChart) otChart.destroy();
    if(wardChart) wardChart.destroy();
    if(typeChart) typeChart.destroy();
    if(anaesthesiaChart) anaesthesiaChart.destroy();

    otChart=createChart(document.getElementById("otChart"),"OT Wise",countBy("ot"));
    wardChart=createChart(document.getElementById("wardChart"),"Ward Wise",countBy("ward"));
    typeChart=createChart(document.getElementById("typeChart"),"Major/Minor",countBy("type"));
    anaesthesiaChart=createChart(document.getElementById("anaesthesiaChart"),"Anaesthesia",countBy("anaesthesia"));
}

function exportPDF(){
    const element=document.getElementById("summarySection");
    html2pdf().from(element).save("Executive_Summary.pdf");
}

function updateClock(){
    const now=new Date();
    clock.innerHTML=now.toLocaleString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
}
setInterval(updateClock,1000);

</script>

</body>
</html>
