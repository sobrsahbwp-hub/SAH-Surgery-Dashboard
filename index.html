<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADIQ ABBASI HOSPITAL – Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f4f7fb;color:#1a1a1a;}
header{
background:#002855;
color:white;
padding:25px 10px;
text-align:center;
}
header h1{margin:0;font-size:24px;letter-spacing:1px;}
header h2{margin:5px 0 0;font-weight:400;font-size:14px;}

.container{max-width:1400px;margin:auto;padding:20px;}

.filters{
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
margin-bottom:25px;
}
.filter{display:flex;flex-direction:column;min-width:170px;}
.filter label{font-weight:600;font-size:13px;margin-bottom:5px;}
select,input{
padding:8px;
border-radius:6px;
border:1px solid #ccc;
}

.kpis{text-align:center;margin-bottom:20px;}
.kpi-large{
font-size:32px;
font-weight:bold;
color:#002855;
margin-bottom:15px;
}
.kpi-row{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:10px;
}
.kpi{
background:white;
padding:12px 18px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
min-width:180px;
font-weight:600;
}

.summary{
background:white;
padding:18px;
border-radius:12px;
box-shadow:0 3px 10px rgba(0,0,0,.08);
margin-bottom:25px;
font-size:14px;
line-height:1.7;
}

.charts{
display:flex;
flex-wrap:wrap;
gap:25px;
justify-content:center;
}

.chart-box{
width:430px;
height:340px;
background:white;
padding:15px;
border-radius:14px;
box-shadow:0 4px 14px rgba(0,0,0,.1);
}

canvas{
width:100%!important;
height:100%!important;
}

.buttons{
display:flex;
justify-content:space-between;
margin-top:30px;
}

button{
padding:10px 16px;
border:none;
border-radius:6px;
background:#002855;
color:white;
cursor:pointer;
}
button:hover{background:#004a99;}

footer{
background:#002855;
color:white;
text-align:center;
padding:12px;
margin-top:30px;
font-size:13px;
}
</style>
</head>

<body>

<header>
<h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h1>
<h2>Surgery Performance Dashboard</h2>
</header>

<div class="container">

<div class="filters">
<div class="filter">
<label>From Date</label>
<input type="date" id="fromDate">
</div>
<div class="filter">
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<div class="kpis">
<div class="kpi-large" id="totalKPI">TOTAL SURGERIES: 0</div>
<div class="kpi-row">
<div class="kpi" id="majorKPI">Major: 0</div>
<div class="kpi" id="minorKPI">Minor: 0</div>
</div>
</div>

<div class="summary" id="executiveSummary"></div>

<div class="charts">
<div class="chart-box">
<canvas id="otChart"></canvas>
</div>
<div class="chart-box">
<canvas id="typeChart"></canvas>
</div>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export Executive Summary (PDF)</button>
<button onclick="location.reload()">Refresh</button>
</div>

</div>

<footer>
IT Department – Sadiq Abbasi Hospital, Bahawalpur
</footer>

<script>

const csvURL="YOUR_CSV_LINK_HERE";

let rawData=[];
let charts={};

Papa.parse(csvURL,{
download:true,
header:true,
skipEmptyLines:true,
complete:function(res){

rawData=res.data.map(r=>{

return{
DATE: parseFlexibleDate(r["Date"]),
OT:(r["OT"]||"").toUpperCase().trim(),
TYPE:(r["TYPE"]||"").toUpperCase().trim()
};

}).filter(r=>r.DATE!=null);

applyFilters();
}
});

document.querySelectorAll("input").forEach(e=>e.addEventListener("change",applyFilters));

function parseFlexibleDate(dateStr){

if(!dateStr) return null;

dateStr=dateStr.trim();

if(dateStr.includes("-")){
return new Date(dateStr);
}

if(dateStr.includes("/")){
let parts=dateStr.split("/");

if(parts[2].length===4){

// Detect DD/MM/YYYY or MM/DD/YYYY
if(parseInt(parts[0])>12){
return new Date(parts[2],parts[1]-1,parts[0]);
}else{
return new Date(parts[2],parts[0]-1,parts[1]);
}
}
}

return null;
}

function applyFilters(){

let from=document.getElementById("fromDate").value ? new Date(document.getElementById("fromDate").value) : null;
let to=document.getElementById("toDate").value ? new Date(document.getElementById("toDate").value) : null;

let filtered=rawData.filter(r=>{

if(from && r.DATE<from) return false;
if(to && r.DATE>to) return false;

return true;
});

updateDashboard(filtered);
}

function countBy(data,key){
let obj={};
data.forEach(r=>{
if(r[key]){
obj[r[key]]=(obj[r[key]]||0)+1;
}
});
return obj;
}

function updateDashboard(data){

document.getElementById("totalKPI").innerText="TOTAL SURGERIES: "+data.length;

let typeCounts=countBy(data,"TYPE");

document.getElementById("majorKPI").innerText="Major: "+(typeCounts["MAJOR"]||0);
document.getElementById("minorKPI").innerText="Minor: "+(typeCounts["MINOR"]||0);

generateExecutiveSummary(data,typeCounts);

drawChart("otChart","OT Distribution",countBy(data,"OT"));
drawChart("typeChart","Surgery Type Distribution",typeCounts);
}

function generateExecutiveSummary(data,typeCounts){

let total=data.length;
let major=typeCounts["MAJOR"]||0;
let minor=typeCounts["MINOR"]||0;

let majorPct=total?((major/total)*100).toFixed(1):0;
let minorPct=total?((minor/total)*100).toFixed(1):0;

let summary=
`During the selected reporting period, a total of ${total.toLocaleString()} surgical procedures were performed at Sadiq Abbasi Hospital, Bahawalpur. Major surgeries accounted for ${major.toLocaleString()} cases (${majorPct}%), while minor procedures totaled ${minor.toLocaleString()} cases (${minorPct}%). The operative workload reflects procedural intensity and resource utilization within the defined date parameters. This executive summary provides an analytical overview for hospital administration and surgical governance review.`;

document.getElementById("executiveSummary").innerText=summary;
}

function drawChart(id,title,data){

if(charts[id]) charts[id].destroy();

charts[id]=new Chart(document.getElementById(id),{
type:"bar",
data:{
labels:Object.keys(data),
datasets:[{
label:title,
data:Object.values(data),
borderRadius:6,
backgroundColor:"#003f88"
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{display:false},
title:{
display:true,
text:title,
font:{size:16,weight:'bold'}
}
},
scales:{
y:{
beginAtZero:true
}
}
}
});
}

function exportPDF(){

const { jsPDF }=window.jspdf;
let doc=new jsPDF();

doc.setFontSize(16);
doc.text("SADIQ ABBASI HOSPITAL, BAHAWALPUR",20,20);

doc.setFontSize(13);
doc.text("Surgery Executive Summary Report",20,30);

doc.setFontSize(11);
doc.text(document.getElementById("executiveSummary").innerText,20,45,{maxWidth:170});

doc.setFontSize(9);
doc.text("Generated on: "+new Date().toLocaleString(),20,280);
doc.text("IT Department | Sadiq Abbasi Hospital",140,280);

doc.save("Surgery_Executive_Summary.pdf");
}

</script>

</body>
</html>
