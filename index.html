<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospital Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .filters {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
    }

    select, input {
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #ccc;
        width: 100%;
    }

    .kpis {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-bottom: 30px;
    }

    .kpi {
        background: white;
        padding: 20px;
        text-align: center;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .kpi h2 {
        margin: 0;
        font-size: 28px;
        color: #007bff;
    }

    .chart-box {
        background: white;
        padding: 20px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
</style>
</head>

<body>

<h1>🏥 Hospital Surgery Dashboard</h1>

<div class="filters">
    <select id="ot">
        <option value="ALL">ALL OTS</option>
        <option>MAIN OT</option>
        <option>GYNAE OT</option>
        <option>EMERGENCY OT</option>
    </select>

    <select id="ward">
        <option value="ALL">ALL WARDS</option>
        <option>GYNAE</option>
        <option>ORTHO</option>
        <option>SURGERY</option>
        <option>EYE</option>
    </select>

    <select id="gender">
        <option value="ALL">ALL GENDERS</option>
        <option>MALE</option>
        <option>FEMALE</option>
        <option>TRANSGENDER</option>
    </select>

    <select id="anaesthesia">
        <option value="ALL">ALL TYPE</option>
        <option>LOCAL</option>
        <option>GENERAL</option>
        <option>SPINE</option>
    </select>

    <select id="type">
        <option value="ALL">ALL TYPES</option>
        <option>MAJOR</option>
        <option>MINOR</option>
    </select>

    <select id="ageGroup">
        <option value="ALL">ALL AGES</option>
        <option value="A">Below 30 Days</option>
        <option value="B">1 Month to 1 Year</option>
        <option value="C">1 Year to 10 Years</option>
        <option value="D">10 to 15 Years</option>
        <option value="E">15 & Above</option>
    </select>

    <input type="date" id="fromDate">
    <input type="date" id="toDate">
</div>

<div class="kpis">
    <div class="kpi">
        <p>Total Surgeries</p>
        <h2 id="totalCount">0</h2>
    </div>
    <div class="kpi">
        <p>Major Surgeries</p>
        <h2 id="majorCount">0</h2>
    </div>
    <div class="kpi">
        <p>Minor Surgeries</p>
        <h2 id="minorCount">0</h2>
    </div>
</div>

<div class="chart-box">
    <canvas id="barChart"></canvas>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData = [];
let chart;

fetch(CSV_URL)
    .then(res => res.text())
    .then(text => {
        rawData = parseCSV(text);
        applyFilters();
    });

document.querySelectorAll("select, input").forEach(el => {
    el.addEventListener("change", applyFilters);
});

function parseCSV(text) {
    const lines = text.split("\n");
    const headers = lines[0].split(",");
    return lines.slice(1).map(row => {
        const values = row.split(",");
        let obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
        return obj;
    });
}

function ageMatch(age, group) {
    age = Number(age);
    if (group === "A") return age < 1/12;
    if (group === "B") return age >= 1/12 && age < 1;
    if (group === "C") return age >= 1 && age < 10;
    if (group === "D") return age >= 10 && age < 15;
    if (group === "E") return age >= 15;
    return true;
}

function applyFilters() {
    const ot = document.getElementById("ot").value;
    const ward = document.getElementById("ward").value;
    const gender = document.getElementById("gender").value;
    const ana = document.getElementById("anaesthesia").value;
    const type = document.getElementById("type").value;
    const ageGroup = document.getElementById("ageGroup").value;
    const fromDate = document.getElementById("fromDate").value;
    const toDate = document.getElementById("toDate").value;

    let filtered = rawData.filter(d => {
        return (ot === "ALL" || d.OT === ot) &&
               (ward === "ALL" || d.WARD === ward) &&
               (gender === "ALL" || d.GENDER === gender) &&
               (ana === "ALL" || d.Anaesthesia === ana) &&
               (type === "ALL" || d.Type === type) &&
               ageMatch(d.AGE, ageGroup) &&
               (!fromDate || new Date(d.DATE) >= new Date(fromDate)) &&
               (!toDate || new Date(d.DATE) <= new Date(toDate));
    });

    document.getElementById("totalCount").innerText = filtered.length;
    document.getElementById("majorCount").innerText = filtered.filter(d => d.Type === "MAJOR").length;
    document.getElementById("minorCount").innerText = filtered.filter(d => d.Type === "MINOR").length;

    drawChart(filtered);
}

function drawChart(data) {
    const wards = {};
    data.forEach(d => wards[d.WARD] = (wards[d.WARD] || 0) + 1);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("barChart"), {
        type: "bar",
        data: {
            labels: Object.keys(wards),
            datasets: [{
                label: "Number of Surgeries",
                data: Object.values(wards),
                backgroundColor: "#007bff"
            }]
        }
    });
}
</script>

</body>
</html>
