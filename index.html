<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sadiq Abbasi Hospital – Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #f2f5f9;
    margin: 0;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

header img {
    height: 80px;
}

header h1 {
    margin: 8px 0 0;
    color: #003366;
}

.filters, .kpis {
    display: grid;
    gap: 15px;
}

.filters {
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    margin-bottom: 20px;
}

.filter-box, .kpi, .chart-box {
    background: #fff;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

label {
    font-size: 13px;
    font-weight: 600;
    display: block;
    margin-bottom: 5px;
}

select, input, button {
    width: 100%;
    padding: 7px;
    border-radius: 4px;
    border: 1px solid #ccc;
}

.kpis {
    grid-template-columns: repeat(3, 1fr);
    margin-bottom: 25px;
}

.kpi {
    text-align: center;
}

.kpi h2 {
    margin: 10px 0 0;
    font-size: 30px;
    color: #0d6efd;
}

.charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 20px;
    margin-bottom: 25px;
}

.export-btn {
    max-width: 300px;
    margin: auto;
    background: #198754;
    color: white;
    font-size: 16px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="dashboard">

<header>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Hospital_icon.svg/1024px-Hospital_icon.svg.png">
    <h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h1>
</header>

<div class="filters">
    <div class="filter-box"><label>OT</label>
        <select id="ot"><option value="ALL">ALL OTS</option><option>MAIN OT</option><option>GYNAE OT</option><option>EMERGENCY OT</option></select>
    </div>
    <div class="filter-box"><label>Ward</label>
        <select id="ward"><option value="ALL">ALL WARDS</option><option>GYNAE</option><option>ORTHO</option><option>SURGERY</option><option>EYE</option></select>
    </div>
    <div class="filter-box"><label>Gender</label>
        <select id="gender"><option value="ALL">ALL GENDERS</option><option>MALE</option><option>FEMALE</option><option>TRANSGENDER</option></select>
    </div>
    <div class="filter-box"><label>Anaesthesia</label>
        <select id="anaesthesia"><option value="ALL">ALL TYPE</option><option>LOCAL</option><option>GENERAL</option><option>SPINE</option></select>
    </div>
    <div class="filter-box"><label>Type</label>
        <select id="type"><option value="ALL">ALL TYPES</option><option>MAJOR</option><option>MINOR</option></select>
    </div>
    <div class="filter-box"><label>Age Group</label>
        <select id="ageGroup">
            <option value="ALL">ALL</option>
            <option value="A">Below 30 Days</option>
            <option value="B">1 Month to 1 Year</option>
            <option value="C">1 Year to 14 Years</option>
            <option value="D">14 to 30 Years</option>
            <option value="E">30 to 45 Years</option>
            <option value="F">45 Years & Above</option>
        </select>
    </div>
    <div class="filter-box"><label>From Date</label><input type="date" id="fromDate"></div>
    <div class="filter-box"><label>To Date</label><input type="date" id="toDate"></div>
</div>

<div class="kpis">
    <div class="kpi"><p>Total Surgeries</p><h2 id="total">0</h2></div>
    <div class="kpi"><p>Major Surgeries</p><h2 id="major">0</h2></div>
    <div class="kpi"><p>Minor Surgeries</p><h2 id="minor">0</h2></div>
</div>

<div class="charts">
    <div class="chart-box"><canvas id="typeChart"></canvas></div>
    <div class="chart-box"><canvas id="otChart"></canvas></div>
    <div class="chart-box"><canvas id="wardChart"></canvas></div>
</div>

</div>

<button class="export-btn" onclick="exportPDF()">📄 Export Dashboard to PDF</button>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData = [];
let charts = {};

fetch(CSV_URL).then(r=>r.text()).then(t=>rawData=parseCSV(t)).then(applyFilters);
document.querySelectorAll("select,input").forEach(e=>e.onchange=applyFilters);

function parseCSV(t){
    const [h,...l]=t.trim().split("\n");
    const heads=h.split(",");
    return l.map(r=>{
        const v=r.split(",");
        let o={}; heads.forEach((k,i)=>o[k.trim()]=v[i]?.trim()); return o;
    });
}

function ageOk(a,g){
    a=+a;
    if(g==="A")return a<1/12;
    if(g==="B")return a<1;
    if(g==="C")return a<14;
    if(g==="D")return a<30;
    if(g==="E")return a<45;
    if(g==="F")return a>=45;
    return true;
}

function applyFilters(){
    const f=id=>document.getElementById(id).value;
    let d=rawData.filter(r=>
        (f("ot")==="ALL"||r.OT===f("ot")) &&
        (f("ward")==="ALL"||r.WARD===f("ward")) &&
        (f("gender")==="ALL"||r.GENDER===f("gender")) &&
        (f("anaesthesia")==="ALL"||r.Anaesthesia===f("anaesthesia")) &&
        (f("type")==="ALL"||r.Type===f("type")) &&
        ageOk(r.AGE,f("ageGroup")) &&
        (!f("fromDate")||new Date(r.DATE)>=new Date(f("fromDate"))) &&
        (!f("toDate")||new Date(r.DATE)<=new Date(f("toDate")))
    );

    total.innerText=d.length;
    major.innerText=d.filter(x=>x.Type==="MAJOR").length;
    minor.innerText=d.filter(x=>x.Type==="MINOR").length;

    drawPie("typeChart",["Major","Minor"],
        [major.innerText,minor.innerText],
        ["#dc3545","#198754"]);

    drawGroupPie("otChart",d,"OT","OT-wise Surgeries");
    drawGroupPie("wardChart",d,"WARD","Ward-wise Surgeries");
}

function drawPie(id,labels,data,colors){
    charts[id]?.destroy();
    charts[id]=new Chart(document.getElementById(id),{
        type:"pie",
        data:{labels,datasets:[{data,backgroundColor:colors}]}
    });
}

function drawGroupPie(id,data,key,title){
    const map={};
    data.forEach(d=>map[d[key]]=(map[d[key]]||0)+1);
    drawPie(id,Object.keys(map),Object.values(map),
        ["#0d6efd","#ffc107","#20c997","#6f42c1","#fd7e14"]);
}

async function exportPDF(){
    const { jsPDF } = window.jspdf;
    const pdf=new jsPDF("p","mm","a4");
    const canvas=await html2canvas(document.getElementById("dashboard"));
    const img=canvas.toDataURL("image/png");
    pdf.addImage(img,"PNG",5,5,200,0);
    pdf.save("Sadiq_Abbasi_Hospital_Dashboard.pdf");
}
</script>

</body>
</html>
