<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADIQ ABBASI HOSPITAL – Surgery Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
body{font-family:'Segoe UI',sans-serif;margin:0;background:#f4f7fb;}
header{text-align:center;padding:20px;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.05);position:relative;}
header h1{margin:0;font-size:20px;}
#clock{position:absolute;right:20px;top:20px;font-size:13px;font-weight:600;}
.container{padding:20px;}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:20px;}
.filters label{font-weight:600;font-size:13px;}
.filters select,.filters input{width:100%;padding:6px;margin-top:4px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px;margin-bottom:25px;}
.kpi{background:white;padding:15px;border-radius:8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.05);}
.kpi h2{margin:5px 0;color:#007bff;}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;}
.chart-box{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,0.05);height:350px;}
.chart-box canvas{height:100%!important;}
.buttons{display:flex;justify-content:space-between;margin-top:25px;}
footer{text-align:center;padding:15px;background:white;margin-top:20px;}
</style>
</head>

<body>

<header>
<h1>SADIQ ABBASI HOSPITAL, BAHAWALPUR<br>SURGERY DASHBOARD</h1>
<div id="clock"></div>
</header>

<div class="container">

<div class="filters">
<div>
<label>From Date</label>
<input type="date" id="fromDate">
</div>

<div>
<label>To Date</label>
<input type="date" id="toDate">
</div>
</div>

<div class="kpis">
<div class="kpi"><div>Total Surgeries</div><h2 id="totalKPI">0</h2></div>
<div class="kpi"><div>Male</div><h2 id="maleKPI">0</h2></div>
<div class="kpi"><div>Female</div><h2 id="femaleKPI">0</h2></div>
<div class="kpi"><div>Major</div><h2 id="majorKPI">0</h2></div>
<div class="kpi"><div>Minor</div><h2 id="minorKPI">0</h2></div>
</div>

<div class="charts">
<div class="chart-box"><canvas id="otChart"></canvas></div>
<div class="chart-box"><canvas id="wardChart"></canvas></div>
</div>

<div class="buttons">
<button onclick="exportPDF()">Export PDF</button>
<button onclick="location.reload()">Refresh</button>
</div>

</div>

<footer>
Developed By: MUHAMMAD UMAIR SYED (IT Officer)
</footer>

<script>

const sheetURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?gid=30892223&single=true&output=csv";

let rawData=[];
let charts={};

// ============================
// LOAD DATA
// ============================
Papa.parse(sheetURL,{
    download:true,
    header:true,
    skipEmptyLines:true,
    complete:function(results){

        rawData = results.data.map(row=>{

            // Trim headers safely
            let cleanRow={};
            Object.keys(row).forEach(key=>{
                cleanRow[key.trim().toUpperCase()] = row[key];
            });

            return {
                ...cleanRow,
                PARSED_DATE: parseMMDDYYYY(cleanRow["DATE"])
            };
        });

        applyFilters();
    }
});

// ============================
// STRICT MM/DD/YYYY PARSER
// ============================
function parseMMDDYYYY(dateStr){

    if(!dateStr) return null;

    const parts = dateStr.split("/");

    if(parts.length !== 3) return null;

    const month = parseInt(parts[0]) - 1;
    const day   = parseInt(parts[1]);
    const year  = parseInt(parts[2]);

    const date = new Date(year, month, day);

    if(isNaN(date)) return null;

    date.setHours(0,0,0,0);

    return date;
}

// ============================
// FILTERING LOGIC
// ============================
function applyFilters(){

    const fromVal = document.getElementById("fromDate").value;
    const toVal   = document.getElementById("toDate").value;

    const fromDate = fromVal ? new Date(fromVal) : null;
    const toDate   = toVal ? new Date(toVal) : null;

    if(fromDate) fromDate.setHours(0,0,0,0);
    if(toDate)   toDate.setHours(23,59,59,999);

    const filtered = rawData.filter(r=>{

        if(!r.PARSED_DATE) return false;

        if(fromDate && r.PARSED_DATE < fromDate) return false;
        if(toDate   && r.PARSED_DATE > toDate)   return false;

        return true;
    });

    updateDashboard(filtered);
}

document.querySelectorAll("input").forEach(el=>{
    el.addEventListener("change",applyFilters);
});

// ============================
// DASHBOARD UPDATE
// ============================
function updateDashboard(data){

    document.getElementById("totalKPI").innerText=data.length;
    document.getElementById("maleKPI").innerText=data.filter(r=>r["GENDER"]==="MALE").length;
    document.getElementById("femaleKPI").innerText=data.filter(r=>r["GENDER"]==="FEMALE").length;
    document.getElementById("majorKPI").innerText=data.filter(r=>r["TYPE"]==="MAJOR").length;
    document.getElementById("minorKPI").innerText=data.filter(r=>r["TYPE"]==="MINOR").length;

    createChart("otChart",countBy(data,"OT"));
    createChart("wardChart",countBy(data,"WARD"));
}

// ============================
// GROUPING
// ============================
function countBy(data,key){
    let obj={};
    data.forEach(r=>{
        let val=r[key]||"Unknown";
        obj[val]=(obj[val]||0)+1;
    });
    return obj;
}

// ============================
// CHART
// ============================
function createChart(id,dataObj){

    if(charts[id]) charts[id].destroy();

    charts[id]=new Chart(document.getElementById(id),{
        type:'bar',
        data:{
            labels:Object.keys(dataObj),
            datasets:[{
                data:Object.values(dataObj),
                backgroundColor:'#007bff'
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            plugins:{legend:{display:false}},
            scales:{y:{beginAtZero:true}}
        }
    });
}

// ============================
// CLOCK
// ============================
function updateClock(){
    const now=new Date();
    document.getElementById("clock").innerHTML=
        now.toLocaleDateString()+"<br>"+now.toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

// ============================
// PDF EXPORT
// ============================
function exportPDF(){
    html2pdf().from(document.body).set({
        margin:5,
        filename:'Executive_Summary.pdf',
        html2canvas:{scale:2},
        jsPDF:{orientation:'portrait',unit:'mm',format:'a4'}
    }).save();
}

</script>

</body>
</html>
