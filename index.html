<!2-WORKING DASHBOARD>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SADIQ ABBASI HOSPITAL – Surgery Dashboard</title>

<!-- Chart & PDF libraries -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    margin: 0;
}
header {
    background: white;
    padding: 15px;
    text-align: center;
    border-bottom: 3px solid #0b7285;
}
header img {
    height: 80px;
}
h2 {
    margin: 10px 0 0;
    color: #0b7285;
}

.container {
    padding: 15px;
}

.filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px,1fr));
    gap: 10px;
    margin-bottom: 15px;
}

label {
    font-size: 13px;
    font-weight: bold;
}

select, input {
    padding: 6px;
    width: 100%;
}

.kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.kpi {
    background: white;
    padding: 15px;
    border-radius: 6px;
    text-align: center;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
}
.kpi h3 {
    margin: 0;
    color: #0b7285;
}
.kpi p {
    font-size: 22px;
    margin: 5px 0 0;
    font-weight: bold;
}

.chart-box {
    background: white;
    padding: 15px;
    border-radius: 6px;
}

footer {
    background: #0b7285;
    color: white;
    text-align: center;
    padding: 10px;
    margin-top: 20px;
}
footer a {
    color: #ffd43b;
    text-decoration: none;
    font-weight: bold;
}

.export-btn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    padding: 10px 15px;
    background: #0b7285;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <!-- Replace image URL if needed -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Emblem_of_Pakistan.svg">
    <h2>SADIQ ABBASI HOSPITAL, BAHAWALPUR</h2>
</header>

<div class="container">

    <!-- Filters -->
    <div class="filters">
        <div>
            <label>OT</label>
            <select id="ot">
                <option>ALL OTS</option>
                <option>MAIN OT</option>
                <option>GYNAE OT</option>
                <option>EMERGENCY OT</option>
            </select>
        </div>

        <div>
            <label>Ward</label>
            <select id="ward">
                <option>ALL WARDS</option>
                <option>GYNAE</option>
                <option>ORTHO</option>
                <option>SURGERY</option>
                <option>EYE</option>
            </select>
        </div>

        <div>
            <label>Gender</label>
            <select id="gender">
                <option>ALL GENDERS</option>
                <option>MALE</option>
                <option>FEMALE</option>
                <option>TRANSGENDER</option>
            </select>
        </div>

        <div>
            <label>Age Group</label>
            <select id="age">
                <option>ALL</option>
                <option>Below 30 Days</option>
                <option>1 Month to 1 Year</option>
                <option>1 Year to 15 Years</option>
                <option>15 to 30 Years</option>
                <option>30 Years to 45 Years</option>
                <option>45 Years & above</option>
            </select>
        </div>

        <div>
            <label>Anaesthesia</label>
            <select id="anaesthesia">
                <option>ALL TYPES</option>
                <option>LOCAL</option>
                <option>GENERAL</option>
                <option>SPINAL</option>
            </select>
        </div>

        <div>
            <label>From Date</label>
            <input type="date" id="fromDate">
        </div>

        <div>
            <label>To Date</label>
            <input type="date" id="toDate">
        </div>
    </div>

    <!-- KPIs -->
    <div class="kpis">
        <div class="kpi"><h3>Total Surgeries</h3><p id="total">0</p></div>
        <div class="kpi"><h3>Male Surgeries</h3><p id="male">0</p></div>
        <div class="kpi"><h3>Female Surgeries</h3><p id="female">0</p></div>
        <div class="kpi"><h3>Local Anaesthesia</h3><p id="local">0</p></div>
        <div class="kpi"><h3>General Anaesthesia</h3><p id="general">0</p></div>
        <div class="kpi"><h3>Spinal Anaesthesia</h3><p id="spinal">0</p></div>
    </div>

    <!-- Chart -->
    <div class="chart-box">
        <canvas id="otChart"></canvas>
    </div>

</div>

<button class="export-btn" onclick="exportPDF()">Export to PDF</button>

<footer>
Developed By: Software Engineer
<a href="https://www.linkedin.com/in/smus79" target="_blank">
MUHAMMAD UMAIR SYED
</a>
(IT Officer, Sadiq Abbasi Hospital, Bahawalpur)
</footer>

<script>
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ31p735zhDmgNA9Y10m7cJtA4D1igaaKDiIWRkoIWdfi3hHgVNf-zxsjsS3W9yOKw4kRawMN-1cAP6/pub?output=csv";

let chart;

fetch(csvUrl)
.then(res => res.text())
.then(data => {
    const rows = data.split("\n").slice(1).map(r => r.split(","));
    applyFilters(rows);
    document.querySelectorAll("select,input").forEach(el => {
        el.addEventListener("change", () => applyFilters(rows));
    });
});

function ageGroup(age) {
    if (age < 1/12) return "Below 30 Days";
    if (age < 1) return "1 Month to 1 Year";
    if (age <= 15) return "1 Year to 15 Years";
    if (age <= 30) return "15 to 30 Years";
    if (age <= 45) return "30 Years to 45 Years";
    return "45 Years & above";
}

function applyFilters(data) {
    let filtered = data;

    const ot = document.getElementById("ot").value;
    const ward = document.getElementById("ward").value;
    const gender = document.getElementById("gender").value;
    const age = document.getElementById("age").value;
    const ana = document.getElementById("anaesthesia").value;

    filtered = filtered.filter(r =>
        (ot === "ALL OTS" || r[0] === ot) &&
        (ward === "ALL WARDS" || r[1] === ward) &&
        (gender === "ALL GENDERS" || r[2] === gender) &&
        (ana === "ALL TYPES" || r[4] === ana) &&
        (age === "ALL" || ageGroup(parseFloat(r[3])) === age)
    );

    document.getElementById("total").innerText = filtered.length;
    document.getElementById("male").innerText = filtered.filter(r => r[2] === "MALE").length;
    document.getElementById("female").innerText = filtered.filter(r => r[2] === "FEMALE").length;
    document.getElementById("local").innerText = filtered.filter(r => r[4] === "LOCAL").length;
    document.getElementById("general").innerText = filtered.filter(r => r[4] === "GENERAL").length;
    document.getElementById("spinal").innerText = filtered.filter(r => r[4] === "SPINAL").length;

    drawChart(filtered);
}

function drawChart(data) {
    const counts = {};
    data.forEach(r => counts[r[0]] = (counts[r[0]] || 0) + 1);

    if (chart) chart.destroy();
    chart = new Chart(document.getElementById("otChart"), {
        type: "pie",
        data: {
            labels: Object.keys(counts),
            datasets: [{
                data: Object.values(counts)
            }]
        }
    });
}

function exportPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF();
    pdf.text("Sadiq Abbasi Hospital Surgery Dashboard", 10, 10);
    pdf.save("Hospital_Dashboard.pdf");
}
</script>

</body>
</html>
